apiVersion: apps/v1
kind: Deployment
metadata:
  name: openbaotest
  namespace: openbao
  labels:
    app: openbaotest
    chart: openbao-0.1.0
    release: openbao
    heritage: Helm
spec:
  selector:
    matchLabels:
      app: openbaotest
  replicas: 1
  template:
    metadata:
      labels:
        app: openbaotest
    spec:
      containers:
        - name: openbaotest
          # This deployment is for testing purposes to ensure that the secrets are mounted correctly.
          image: busybox:latest 
          command: ["sh", "-c", "while true; do echo 'Hello, World!'; sleep 5; done"]
          volumeMounts:
            - name: v-root-cluster
              mountPath: "/v-root-cluster"
              readOnly: true
          volumeMounts:
            - name: openbao-k8s-auth-secret
              mountPath: "/openbao-k8s-auth-secret"
              readOnly: true
      volumes:
        - name: openbao-k8s-auth-secret
          secret:
            secretName: openbao-k8s-auth-secret
        - name: v-root-cluster
          secret:
            secretName: v-root-cluster--1749549667-97tffxkqhkqfa3ux3lqdk2le-auth-secret

