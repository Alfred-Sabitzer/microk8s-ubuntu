apiVersion: apps/v1
kind: Deployment
metadata:
  name: openbaotest
  namespace: test
  labels:
    app: openbaotest
    chart: openbao-0.1.0
    release: openbao
    heritage: Helm
spec:
  selector:
    matchLabels:
      app: openbaotest
  replicas: 1
  template:
    metadata:
      labels:
        app: openbaotest
    spec:
      containers:
        - name: openbaotest
          # This deployment is for testing purposes to ensure that the secrets are mounted correctly.
          image: busybox:latest 
          command: ["sh", "-c", "while true; do echo 'Hello, World!'; sleep 5; done"]
          volumeMounts:
          - name: alfred-sabitzer
            mountPath: "/mnt/secrets-store"
            readOnly: true
      volumes:
        - name: alfred-sabitzer
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: openbao-kv-alfred