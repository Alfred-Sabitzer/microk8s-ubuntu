apiVersion: apps/v1
kind: Deployment
metadata:
  name: openbaotest
  namespace: test
  labels:
    app: openbaotest
spec:
  selector:
    matchLabels:
      app: openbaotest
  replicas: 1apiVersion: rbac.authorization.k8s.io/v1
# kind: ClusterRoleBinding
# metadata:
#   name: role-tokenreview-binding
#   namespace: test
# roleRef:
#   apiGroup: rbac.authorization.k8s.io
#   kind: ClusterRole
#   name: system:auth-delegator
# subjects:
# - kind: ServiceAccount
#   name: openbaotest-sa
#   namespace: test
# ---    
  template:
    metadata:
      labels:
        app: openbaotest
    spec:
      serviceAccountName: openbaotest-sa
      terminationGracePeriodSeconds: 0      
      containers:
        - name: openbaotest
          # This deployment is for testing purposes to ensure that the secrets are mounted correctly.
          image: busybox:latest 
          command: ["sh", "-c", "while true; do echo 'Hello, World!'; sleep 5; done"]
          volumeMounts:
          - name: secrets-store-inline
            mountPath: "/mnt/secrets-store"
            readOnly: true
      volumes:
        - name: secrets-store-inline
          csi:
            driver: secrets-store.csi.k8s.io 
            readOnly: true
            volumeAttributes:
              secretProviderClass: alfred
