apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: alfred
  namespace: test
spec:
  provider: vault
  # This will create a secret in kubernetes (but is not needed for our purpose)
  # secretObjects:
  # - secretName: alfred
  #   type: Opaque
  #   labels:                                   
  #     environment: "test"
  #   data: 
  #   - objectName: alfred
  #     key: alfred
  parameters:
    openbaoAddress: "https://10.152.183.36:8200"
    openbaoCACertPath: /mnt/tls/ca.crt
    openbaoTLSClientCertPath: /mnt/tls/client.crt
    openbaoTLSClientKeyPath: /mnt/tls/client.key    
    roleName: "alfred-role"
    objects: |
      - objectName: "alfred"
        secretPath: "/v1/secret/data/sabitzer"
        secretKey: "alfred"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbaotest-sa
  namespace: test
  labels:
    app.kubernetes.io/managed-by: "alfred"
