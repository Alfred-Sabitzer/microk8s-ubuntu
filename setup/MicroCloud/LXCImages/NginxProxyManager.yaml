name: NginxProxyManager
description: Nginx Reverse Proxy Manager
status: Stopped
status_code: 102
created_at: '2025-08-07T12:51:44.046534477Z'
last_used_at: '2025-08-07T15:18:47.201849129Z'
location: k4
type: container
project: default
architecture: x86_64
ephemeral: false
stateful: false
profiles:
  - macvlan-profile
  - default
config:
  cloud-init.user-data: |+
    #cloud-config
    locale: C.UTF-8
    timezone: Europe/Vienna
    package_update: true
    package_upgrade: true
    package_reboot_if_required: true
    write_files:
      - path:  /etc/netplan/50-cloud-init.yaml
        permissions: '0600'
        content: |
             network:
               version: 2
               ethernets:
                eth0:
                  macaddress: ba:e4:64:bc:81:d7
                  dhcp4: yes
                  dhcp6: yes
                  addresses:
                    - 192.168.0.200/24 # Desired ipv address
                  routes:
                    - to: default
                      via: 192.168.0.1
                  nameservers:
                    addresses:
                      - 87.243.128.30
                      - 78.152.93.30
                # eth1:
                #   dhcp4: no
                #   dhcp6: no
                #   addresses: 
                #     - 240.192.0.10/24
                #   routes:
                #     - to: default
                #       via: 240.192.0.1
    runcmd:
      - [sudo, netplan, generate]
      - [sudo, netplan, apply]
      - [apt-get, -y, update]
      - [apt-get, -y, upgrade]
      - [apt, -y, autoremove]
      - [touch, /tmp/cloud_init_completed]
