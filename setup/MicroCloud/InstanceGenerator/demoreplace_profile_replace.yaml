  # Demoreplace profile replace
  limits.memory: 1GiB
  snapshots.schedule.stopped: 'true'
  snapshots.schedule: '@daily'
  snapshots.expiry: 2w
config:
  cloud-init.user-data: |
    #cloud-config
    locale: C.UTF-8
    timezone: Europe/Vienna
    package_update: true
    package_upgrade: true
    package_reboot_if_required: true
