description: Nginx Proxy Manager https://nginxproxymanager.com/
type: container
project: default
architecture: x86_64
ephemeral: false
stateful: false
profiles:
  - ovn
config:
  cloud-init.network-config: |
    version: 2
    ethernets:
      eth0:
        dhcp6: no
        dhcp4: no
        addresses:     # Static IP address
          - 10.224.32.2/24
        nameservers:
          search: [slainte.at]
          addresses: [10.224.32.1]
        routes:
          - to: default
            via: 10.224.32.1
  cloud-init.user-data: |
    #cloud-config
    locale: C.UTF-8
    timezone: Europe/Vienna
    package_update: true
    package_upgrade: true
    package_reboot_if_required: true
    packages:
      - apt-utils
      - iputils-ping
      - podman
      - podman-compose      
    runcmd: 
      - [podman-compose, --file docker-compose.yml, up, --detach]
      - [touch, /tmp/cloud_init_completed]
  image.architecture: amd64
  image.description: ubuntu 24.04 LTS amd64 (minimal release) (20250727)
  image.label: minimal release
  image.os: ubuntu
  image.release: noble
  image.serial: '20250727'
  image.type: squashfs
  image.version: '24.04'
devices:
  root:
    path: /
    pool: remote
    size: 3GiB
    type: disk


