            - 78.152.93.30
  cloud-init.user-data: |
    #cloud-config
    write_files:
      - content: |
          # https://krython.com/post/setting-up-alpine-linux-dns-configuration/
          # https://wiki.alpinelinux.org/wiki/Configure_Networking
          # Primary and secondary DNS servers
          nameserver 87.243.128.30
          nameserver 78.152.93.30

          # Local domain search
          search local.domain slainte.at

          # DNS options
          options timeout:2
          options attempts:3
          options rotate
          options edns0
        owner: root:root
        path: /etc/resolv.conf
        permissions: '0644'
      - content: |
          #!/bin/sh
          ############################################################################################
          # Inspiration: https://github.com/redis/redis/blob/unstable/utils/gen-test-certs.sh
          # Generiere Zertifikate
          #
          #   ${CERTDIR}/ca.{crt,key}          Self signed CA certificate.
          #   ${CERTDIR}/redis.{crt,key}       A certificate with no key usage/policy restrictions.
          #   ${CERTDIR}/client.{crt,key}      A certificate restricted for SSL client usage.
          #   ${CERTDIR}/server.{crt,key}      A certificate restricted for SSL server usage.
          #   ${CERTDIR}/redis.dh              DH Params file.
          ############################################################################################
          #shopt -o -s errexit    #—Terminates  the shell script  if a command returns an error code.
          #shopt -o -s xtrace #—Displays each command before it’s executed.
          #shopt -o -s nounset #-No Variables without definition

          NODAYS=3650
          FULLHOST="slainte.at"
          KEYLEN=4096
          CERTDIR="./certs"
          #CERTDIR="tls/certs"  # Das ist für lokale Tests

          generate_cert() {
              local name=$1
              local cn="$2"
              local opts="$3"

              local keyfile=${CERTDIR}/${name}.key
              local certfile=${CERTDIR}/${name}.crt

              [ -f $keyfile ] || openssl genrsa -out $keyfile ${KEYLEN}
              openssl req \
                  -new -sha256 \
                  -subj "/C=CA/ST=QC/O=Slainte/CN=$cn" \
                  -key $keyfile | \
                  openssl x509 \
                      -req -sha256 \
                      -CA ${CERTDIR}/ca.crt \
                      -CAkey ${CERTDIR}/ca.key \
                      -CAserial ${CERTDIR}/ca.txt \
                      -CAcreateserial \
                      -days ${NODAYS} \
                      $opts \
                      -out $certfile
          }

          mkdir -p ${CERTDIR}
          [ -f ${CERTDIR}/ca.key ] || openssl genrsa -out ${CERTDIR}/ca.key ${KEYLEN}
          openssl req \
              -x509 -new -nodes -sha256 \
              -key ${CERTDIR}/ca.key \
              -days ${NODAYS} \
              -subj '/C=CA/ST=QC/O=Slainte/CN=Certificate Authority' \
              -out ${CERTDIR}/ca.crt

          cat > ${CERTDIR}/openssl.cnf <<_END_
          [ server_cert ]
          keyUsage = digitalSignature, keyEncipherment
          nsCertType = server
          [ client_cert ]
          keyUsage = digitalSignature, keyEncipherment
          nsCertType = client
          _END_

          generate_cert server "${FULLHOST} - Server-only" "-extfile ${CERTDIR}/openssl.cnf -extensions server_cert"
          generate_cert client "${FULLHOST} - Client-only" "-extfile ${CERTDIR}/openssl.cnf -extensions client_cert"
          generate_cert redis "${FULLHOST} - Generic-cert" " "

          [ -f ${CERTDIR}/redis.dh ] || openssl dhparam -out ${CERTDIR}/redis.dh 1024

          cat  ${CERTDIR}/*.crt > ${CERTDIR}/fullchain.pem
          cat  ${CERTDIR}/*.key > ${CERTDIR}/fullkey.pem
          chmod 400 ${CERTDIR}/*.key
          chmod 444 ${CERTDIR}/*.crt
          chmod 444 ${CERTDIR}/fullchain.pem
          chmod 400 ${CERTDIR}/fullkey.pem    
          echo "Alle Zertifikate generiert"
          ls -lsia ${CERTDIR}
        owner: root:root
        path: /root/generate_certificates.sh
        permissions: '0755'
      - content: |
          #!/bin/sh
          # Install HAProxy on Alpine Linux
          # https://ipv6.rs/tutorial/Alpine_Linux_Latest/HAProxy/
          # https://www.haproxy.com/blog/haproxy-2-0-0
          echo "Update System"
          apk --no-cache update && apk upgrade
          TZ=Europe/Vienna
          echo "Set Timezone to ${TZ}"
          apk add --update tzdata --no-cache
          cp /usr/share/zoneinfo/${TZ} /etc/localtime
          echo $TZ > /etc/timezone
          echo "Install HAProxy" 
          # Install HAProxy
          apk add --no-cache haproxy openssl
          echo "HAProxy installed successfully"
          echo "Create directories"
          mkdir -p /root/certs
          # Create certiticasts
          /root/generate_certificates.sh
          echo "Copy certificates to directory"
          cp ./certs/fullchain.pem /etc/ssl/certs/site.pem
          cat ./certs/server.crt ./certs/server.key > /etc/ssl/private/site.key 
          echo "Certificates provided"
          haproxy -c -f /etc/haproxy/haproxy.cfg || exit 1
          haproxy -p /run/haproxy.pid -f /etc/haproxy/haproxy.cfg
          echo "HAProxy service started"
        owner: root:root
        path: /root/haproxy_install.sh
        permissions: '0755'
      - content: |
          #---------------------------------------------------------------------
          # Example configuration for a possible web application.  See the
          # full configuration options online.
          #
          #   http://haproxy.1wt.eu/download/1.5/doc/configuration.txt
          #
          #---------------------------------------------------------------------

          #---------------------------------------------------------------------
          # Global settings
          #---------------------------------------------------------------------
          global
              # to have these messages end up in /var/log/haproxy.log you will
              # need to:
              #
              # 1) configure syslog to accept network log events.  This is done
              #    by adding the '-r' option to the SYSLOGD_OPTIONS in
              #    /etc/sysconfig/syslog
              #
              # 2) configure local2 events to go to the /var/log/haproxy.log
              #   file. A line like the following can be added to
              #   /etc/sysconfig/syslog
              #
              #    local2.*                       /var/log/haproxy.log
              #
              global
              # https://sematext.com/blog/haproxy-logs/
              log stdout format raw local0 debug
              #log         127.0.0.1 local2

              chroot      /var/lib/haproxy
              #pidfile     /var/run/haproxy.pid
              maxconn     4000
              user        haproxy
              group       haproxy
              daemon

              # turn on stats unix socket
              stats socket /var/lib/haproxy/stats

              # Default SSL material locations
              ca-base /etc/ssl/certs
              crt-base /etc/ssl/private

              # See: https://ssl-config.mozilla.org/#server=haproxy&server-version=2.0.3&config=intermediate
              ssl-default-bind-ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384
              ssl-default-bind-ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256
              ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets

          #---------------------------------------------------------------------
          # common defaults that all the 'listen' and 'backend' sections will
          # use if not designated in their block
          #---------------------------------------------------------------------
          defaults
              mode                    http
              log                     global
              option                  httplog
              option                  dontlognull
              option http-server-close
              #option forwardfor       except 127.0.0.0/8
              option                  redispatch
              retries                 3
              timeout http-request    10s
              timeout queue           1m
              timeout connect         10s
              timeout client          1m
              timeout server          1m
              timeout http-keep-alive 10s
              timeout check           10s
              maxconn                 3000
              #errorfile 400 /etc/haproxy/errors/400.http
              #errorfile 403 /etc/haproxy/errors/403.http
              #errorfile 408 /etc/haproxy/errors/408.http
              #errorfile 500 /etc/haproxy/errors/500.http
              #errorfile 502 /etc/haproxy/errors/502.http
              #errorfile 503 /etc/haproxy/errors/503.http
              #errorfile 504 /etc/haproxy/errors/504.http

          #---------------------------------------------------------------------
          # Entry point for our services
          #---------------------------------------------------------------------
          frontend localhost443
            bind :443 ssl crt /etc/ssl/private/site.key 
            option tcplog
            mode tcp
            log                     global
            acl tls req.ssl_hello_type 1
            tcp-request inspect-delay 5s
            tcp-request content accept if tls

            #Set acl based on the domain name
            acl is_lxc_dashboard hdr(host) -i lxc.slainte.at

            #Set backend for each acl
            use_backend lxc_dashboard_https if is_lxc_dashboard

          #---------------------------------------------------------------------
          # frontend statistics https://sematext.com/blog/haproxy-logs/
          #---------------------------------------------------------------------
          frontend stats
            bind *:8404
            stats enable
            stats uri /stats
            stats refresh 10s
            stats admin if LOCALHOST

          #---------------------------------------------------------------------
          # static backend for serving up images, stylesheets and such
          #---------------------------------------------------------------------
          #backend static
          #    balance     roundrobin
          #    server      static 127.0.0.1:4331 check

          #---------------------------------------------------------------------
          # round robin balancing between the various backends
          #---------------------------------------------------------------------
          backend lxc_dashboard_https
              mode tcp
              log                     global
              option ssl-hello-chk
              acl tls req.ssl_hello_type 1              
              balance     roundrobin
              server  k1 192.168.0.191:8443 check ssl verify none
              server  k2 192.168.0.192:8443 check ssl verify none
              server  k3 192.168.0.193:8443 check ssl verify none
              server  k4 192.168.0.194:8443 check ssl verify none
          # 
        owner: root:root
        path: /etc/haproxy/haproxy.cfg
        permissions: '0644'
    runcmd:
      - [ sh, -c, 'sleep 30 && /root/haproxy_install.sh > /var/log/haproxy_install.log' ]
