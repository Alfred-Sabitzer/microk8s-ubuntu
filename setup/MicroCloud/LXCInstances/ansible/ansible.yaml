    runcmd:
      - |
        echo "################################################################################"
        mkdir -p /home/ansible/config
        chown ansible:ansible /home/ansible/config
        cd /home/ansible/config
        tar -xf /tmp/ansible_config.tar.xz
        chown -R ansible:ansible *
        chown ansible:ansible /home/ansible/config
        rm -f /tmp/ansible_config.tar.xz
        echo "################################################################################"
      - |
        echo "################################################################################"
        mkdir -p /home/ansible/scripts
        chown ansible:ansible /home/ansible/scripts
        cd /home/ansible/scripts
        tar -xf /tmp/ansible_scripts.tar.xz
        chown -R ansible:ansible *
        chown ansible:ansible /home/ansible/scripts
        rm -f /tmp/ansible_scripts.tar.xz
        echo "################################################################################"
      - |
        rc-update add sshd default
      - |
        rc-service sshd start

devices:
  root:
    path: /
    pool: default
    size: 1GiB
    type: disk
