    runcmd:
      - |
        echo "################################################################################"
        mkdir -p /root/config
        chown root:root /root/config
        cd /root/config
        tar -xf /tmp/config.tar.xz
        chown -R root:root *
        chown root:root /root/config
        rm -f /tmp/config.tar.xz
        echo "################################################################################"
      - |
        ls -lisa /root

