apiVersion: networking.istio.io/v1alpha3
kind: Gateway
metadata:
  name: kiali-gateway
  namespace: kiali
spec:
  selector:
    istio: ingressgateway
  servers:
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - "kiali.slainte.at"   # REPLACE with your hostname (or use "*" for any host)
---
apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: kiali-vs
  namespace: kiali
spec:
  hosts:
    - "kiali.slainte.at"     # must match Gateway host
  gateways:
    - "kiali/kiali-gateway"
  http:
    - match:
        - uri:
            prefix: /kiali      # adjust if Kiali is served at a different basePath
      rewrite:
        uri: /                  # strip /kiali before forwarding to svc
      route:
        - destination:
            host: kiali.kiali.svc.cluster.local
            port:
              number: 20001     # adjust if your Kiali service uses a different port




