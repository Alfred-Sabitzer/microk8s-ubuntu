# Root Self-Signed CA
# https://cert-manager.io/docs/configuration/selfsigned/
---
# Root CA (self-signed)
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: k8s-root-issuer
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: k8s-root-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: k8s-root-ca
  secretName: k8s-root-ca-secret
  duration: 87600h # 10 years
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  issuerRef:
    name: k8s-root-issuer
    kind: ClusterIssuer
    group: cert-manager.io
---
# Intermediate CA signed by Root CA
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: k8s-intermediate-issuer
spec:
  ca:
    secretName: k8s-root-ca-secret
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: k8s-intermediate-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: k8s-intermediate-ca
  secretName: k8s-intermediate-ca-secret
  duration: 43800h # 5 years
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  issuerRef:
    name: k8s-intermediate-issuer
    kind: ClusterIssuer
    group: cert-manager.io
---