---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: k8s-issuer
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: k8s-selfsigned-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: k8s-selfsigned-ca
  secretName: k8s-root-secret
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always # https://cert-manager.io/docs/usage/certificate/ # Rotate the private key on each renewal
  issuerRef:
    name: k8s-issuer
    kind: ClusterIssuer
    group: cert-manager.io
---
