---
# https://github.com/kubernetes/dashboard/blob/master/docs/user/access-control/creating-sample-user.md
# dashboard-service-account.yaml
# Creates a cluster-admin ServiceAccount and ClusterRoleBinding for dashboard login.
# WARNING: This grants full cluster admin rights. Use only for testing or trusted environments.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cluster-admin
  namespace: kubernetes-dashboard
  labels:
    role: cluster-admin
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cluster-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: cluster-admin
    namespace: kubernetes-dashboard
---
#Getting a long-lived Bearer Token for ServiceAccount
apiVersion: v1
kind: Secret
metadata:
  name: cluster-admin
  namespace: kubernetes-dashboard
  annotations:
    kubernetes.io/service-account.name: "cluster-admin" # Must match the ServiceAccount name
type: kubernetes.io/service-account-token
# kubectl get secret cluster-admin -n kubernetes-dashboard -o jsonpath="{.data.token}" | base64 -d