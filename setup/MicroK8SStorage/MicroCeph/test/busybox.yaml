# busybox.yaml
# Deploys a BusyBox pod to test Ceph RBD PVC provisioning and encryption.
---
kind: Namespace
apiVersion: v1
metadata:
  name: test
  labels:
    kubernetes.io/metadata.name: test
spec:
  finalizers:
    - kubernetes
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rook
  namespace: test
  labels:
    app: bbrook
    storage: rook
spec:
  accessModes:
    - ReadWriteOnce 
  storageClassName: ceph-rbd
  resources:
    requests:
      storage: 1Mi
---
# This is an example of a Kubernetes Deployment that uses a PersistentVolumeClaim to write logs to an ceph shared storage.
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: bbrook
    storage: rook
  name: bbrook
  namespace: test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bbrook
  template:
    metadata:
      labels:
        app: bbrook
    spec:
      containers:
      - image: busybox:latest
        name: bbrook
        command: ["sh", "-c", "while true; do echo 'Hello, World!'; sleep 5; done"]
        volumeMounts:
          - name: rook
            mountPath: "/mnt/rook"
      volumes:
      - name: rook
        persistentVolumeClaim:
          claimName: rook
---

