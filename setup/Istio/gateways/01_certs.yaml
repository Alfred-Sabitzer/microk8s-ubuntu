
#1) Zertifikate
#A) Apex slainte.at via Lets Encrypt (cert-manager)
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: slainte-at
  namespace: istio-gateways
spec:
  secretName: slainte-at-tls
  issuerRef:
    name: ${K8S_LETSENCRYPT}
    kind: ClusterIssuer
    group: cert-manager.io
  dnsNames:
  - "slainte.at"
  commonName: "public certificate for slainte.at"
  subject:
    countries:
    - "AT"
    provinces:
    - "Vienna"
    organizations:
    - "Slainte Organization"
    organizationalUnits:
    - "${K8S_LETSENCRYPT}"
  usages:
    - digital signature
    - key encipherment
    - server auth
  duration: 2160h        # 90d
  renewBefore: 360h      # 15d
  privateKey:
    algorithm: RSA
    size: 2048
---
# B) Wildcard *.slainte.at via k8s-issuer (für mTLS Server-Zertifikat)
# Server certificate for mTLS listener. CA cert included in secret for mutual TLS.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wildcard-slainte-at-mtls
  namespace: istio-gateways
spec:
  secretName: wildcard-slainte-at-mtls-credential
  issuerRef:
    name: k8s-issuer
    kind: ClusterIssuer
    group: cert-manager.io
  dnsNames:
  - "*.slainte.at"
  commonName: "private certificate for slainte.at"
  subject:
    countries:
    - "AT"
    provinces:
    - "Vienna"
    organizations:
    - "Slainte Organization"
    organizationalUnits:
    - "k8s-issuer"
  usages:
    - digital signature
    - key encipherment
    - server auth
  duration: 2160h        # 90d
  renewBefore: 360h      # 15d
  privateKey:
    algorithm: RSA
    size: 2048
---
# C) Client Certificate (für mTLS - LXD Client)
# Used for client authentication in mutual TLS. Add more certificates for additional clients.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: client-lxd-slainte-at-mtls
  namespace: istio-gateways
spec:
  secretName: client-lxd-slainte-at-mtls-credential
  issuerRef:
    name: k8s-issuer
    kind: ClusterIssuer
    group: cert-manager.io
  commonName: "private client certificate for LXD client"
  subject:
    countries:
    - "AT"
    provinces:
    - "Vienna"
    organizations:
    - "Slainte Organization"
    organizationalUnits:
    - "k8s-issuer"
  usages:
    - client auth
  duration: 8760h        # 1 year
  renewBefore: 360h      # 15d
  privateKey:
    algorithm: RSA
    size: 2048
---