---
#Gateway API Gateway (Apex ohne mTLS, Wildcard mit mTLS)
#Das Entscheidende: zwei HTTPS-Listener auf Port 443, getrennt nach Hostname.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: slainte-edge
  namespace: istio-gateways
  labels:
      app: slainte-edge-gateway
spec:
  gatewayClassName: istio

  listeners:

  # HTTP → HTTPS (für alles)
  - name: http
    port: 80
    protocol: HTTP
    hostname: "*.slainte.at"
    allowedRoutes:
      namespaces:
        from: All

  # HTTPS Apex - normales TLS (Let's Encrypt)
  - name: https
    port: 443
    protocol: HTTPS
    hostname: "slainte.at"
    tls:
      mode: Terminate
      certificateRefs:
      - kind: Secret
        name: slainte-at-tls
    allowedRoutes:
      namespaces:
        from: All

  # HTTPS Wildcard - mTLS (k8s-issuer)
  - name: https-wildcard-mtls
    port: 443
    protocol: HTTPS
    hostname: "*.slainte.at"
    tls:
      mode: Terminate
      certificateRefs:
        - kind: Secret
          name: wildcard-slainte-at-mtls-credential
      frontend:
        default:
          validation:
            caCertificateRefs:
            - group: ""
              kind: Secret
              name: client-lxd-slainte-at-mtls-credential
    allowedRoutes:
      namespaces:
        from: All
#
# Warum das funktioniert
#
# Istio mappt jeden Listener auf eine eigene Envoy TLS-Context
# frontend.validation.caCertificateRefs ⇒ Client-Zertifikat wird verlangt
# Apex-Listener hat keine Validation ⇒ öffentlich
#
#💡 Genau das ist der saubere Weg für „mTLS nur für Wildcard".
#
---
#2️⃣ HTTP → HTTPS Redirect (Gateway API, global)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: slainte-http-redirect
  namespace: istio-gateways
spec:
  parentRefs:
  - name: slainte-edge
    sectionName: http
  hostnames:
  - "slainte.at"
  - "*.slainte.at"
  rules:
  - filters:
    - type: RequestRedirect
      requestRedirect:
        scheme: https
        statusCode: 301
---
#5️⃣ Warum das „best practice" ist
#
#    ✔ Gateway API für Ingress & Routing (Standard, zukunftssicher)
#    ✔ Istio Security API für AuthZ (mächtig, auditierbar)
#    ✔ mTLS nicht über IP ersetzen, sondern kombinieren
#    ✔ funktioniert sauber in Ambient Mode
#    ✔ klare Trennung der Listener für unterschiedliche TLS-Modi
#    ✔ keine Workarounds oder Hacks nötig