---
# This VirtualService routes traffic from the http-echo-mutual host to the http-echo service.
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: http-echo-mutual
  namespace: istio-system
spec:
  hosts:
  - "prometheus.${K8S_ENVIRONMENT}.slainte.at"
  gateways:
  - istio-gateways/slainte-at
  http:
  - match:
    - uri:
        prefix: /
    route:
    - destination:
        host: prometheus
        port:
          number: 9090
---