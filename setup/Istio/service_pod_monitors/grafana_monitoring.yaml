---
# ServiceMonitor for Grafana to enable Prometheus scraping of its metrics
# Standard definition in observability is missing "release: kube-prom-stack"
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: kube-prom-stack-grafana
  namespace: observability
  annotations:
    meta.helm.sh/release-name: kube-prom-stack
    meta.helm.sh/release-namespace: observability
  labels:
    app.kubernetes.io/instance: kube-prom-stack
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: grafana
    app.kubernetes.io/version: 12.1.0
    helm.sh/chart: grafana-9.3.3
    release: kube-prom-stack # label used by kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/instance: kube-prom-stack
      app.kubernetes.io/name: grafana
  namespaceSelector:
    matchNames:
    - observability
  endpoints:
  endpoints:
  - honorLabels: true
    path: /metrics
    port: http-web
    interval: 30s
    scrapeTimeout: 10s
---