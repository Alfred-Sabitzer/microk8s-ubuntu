---
# Reserve Disk Space for kube-prometheus-stack
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kube-prom-storage-pvc
  namespace: observability
  labels:
    app.kubernetes.io/instance: kube-prom-stack
    app.kubernetes.io/name: grafana
    storage: rook
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ceph-rbd
  resources:
    requests:
      storage: 10G
  volumeName: kube-prom-storage-pv
---
