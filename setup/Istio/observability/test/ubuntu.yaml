---
# This is just an ubuntu pod that can be used to test anything
# to external services from within the mesh.
# It installs curl and ping so that you can test connectivity.
# It is deployed in the rook-ceph namespace to test egress
# policies that are namespace specific
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: ubuntu
  name: ubuntu
  namespace: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ubuntu
  template:
    metadata:
      labels:
        app: ubuntu
    spec:
      containers:
      - image: ubuntu:noble
        name: ubuntu
        command:
          - sh
          - -c
          - |
            sleep 10
            # create a prometheus exporter script
            cat <<'EOF' > /prometheus_exporter.py
            #!/usr/bin/env python3
            # See https://gist.github.com/rchakode/8c362c23876b82c85e997c029b076540
            # for reference
            # This script exposes system resource usage metrics for Prometheus
            # It exposes CPU and Memory usage every 5 minutes on port 9999
            # Usage:
            #   pip install prometheus_client psutil
            #   python3 prometheus_exporter.py
            # Then configure Prometheus to scrape metrics from http://<host>:9999/metrics
            #
            #
            import prometheus_client
            import time
            import psutil
            import sys

            UPDATE_PERIOD = 300
            SYSTEM_USAGE = prometheus_client.Gauge('system_usage',
                                                  'Hold current system resource usage',
                                                  ['resource_type'])

            if __name__ == '__main__':
              prometheus_client.start_http_server(9999)
              
            while True:
              SYSTEM_USAGE.labels('CPU').set(psutil.cpu_percent())
              SYSTEM_USAGE.labels('Memory').set(psutil.virtual_memory()[2])
              print("metric: CPU: {}%, Memory: {}%".format(psutil.cpu_percent(), psutil.virtual_memory()[2]))  
              sys.stdout.flush()
              time.sleep(UPDATE_PERIOD)
            EOF
            # install curl and ping and prometheus client libraries
            apt-get update -y
            apt-get install curl iputils-ping net-tools python3-pip python3-venv python3-psutil python3-prometheus-client -y
            # pip install prometheus_client psutil
            # make the script executable
            chmod +x /prometheus_exporter.py
            # run the script in the background
            python3 /prometheus_exporter.py &
            while true; do
              echo 'Hello, World!'
              sleep 300
            done
---
# create a service for the ubuntu pod so that we can scrape metrics from it
apiVersion: v1
kind: Service
metadata:
  name: ubuntu
  namespace: observability
  labels:
    app: ubuntu
spec:
  ports:
  - port: 9999
    targetPort: 9999
    protocol: TCP
    name: http-metrics
  selector:
    app: ubuntu
  type: ClusterIP
---
# create a service monitor for the ubuntu pod so that prometheus can scrape metrics from it
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: ubuntu
  namespace: observability
  labels:
    release: kube-prom-stack
spec:
  selector:
    matchLabels:
      app: ubuntu
  endpoints:
  - honorLabels: true
    port: http-metrics
    path: /metrics
    scheme: http
    interval: 30s
    scrapeTimeout: 10s
  namespaceSelector:
    matchNames:
    - observability
---
