---
# HTTPS Routing für http-echo Service (Gateway API)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bookinfo-route
  namespace: bookinfo

spec:
  parentRefs:
  - name: slainte-edge
    namespace: istio-gateways
    sectionName: https-wildcard-mtls
  hostnames:
  - "test.bookinfo.slainte.at"

  rules:
  - backendRefs:
    - group: ""
      kind: Service
      name: productpage
      port: 9080
      weight: 1
    matches:
    - path:
        type: Exact
        value: /productpage
    - path:
        type: PathPrefix
        value: /static
    - path:
        type: Exact
        value: /login
    - path:
        type: Exact
        value: /logout
    - path:
        type: PathPrefix
        value: /api/v1/products

---
