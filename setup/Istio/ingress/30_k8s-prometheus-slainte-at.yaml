---
# VirtualService routing for host kube-prom-stack-kube-prome-prometheus
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: kube-prom-stack-kube-prome-prometheus-vs
  namespace: observability
spec:
  hosts:
    - "k8s.prometheus.slainte.at"
  gateways:
    - "istio-system/http-slainte-gateway"
  http:
    - match:
        - uri:
            prefix: /
      route:
        - destination:
            host: kube-prom-stack-kube-prome-prometheus.observability.svc.cluster.local
            port:
              number: 9090
---