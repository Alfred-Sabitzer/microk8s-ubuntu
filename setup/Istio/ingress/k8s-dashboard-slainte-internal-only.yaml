#       ports:
#         - protocol: TCP
#           port: 443
# ---
# ---
# Notes:
# - Tune CIDRs to match your internal network. If your ingressgateway's egress
#   to the backend changes source IPs, you may need to include node/ingress IPs
#   or allow traffic from the ingressgateway pod IPs as well.
# - Ensure the Gateway selector label matches your cluster's ingressgateway deployment
#   (commonly istio=ingressgateway).
# - Test: after apply, verify public access is blocked and intranet access succeeds.
#   Use 'microk8s kubectl -n istio-system get authorizationpolicy' and check logs/events.
