---
# VirtualService routing for host ${K8S_ENVIRONMENT}.dashboard.slainte.at to kubernetes-dashboard service
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: kubernetes-dashboard-passthrough
  namespace: kubernetes-dashboard
spec:
  hosts:
    - "${K8S_ENVIRONMENT}.dashboard.slainte.at"
  gateways:
    - "istio-system/k8s-passthrough-gateway"
  tls:
    # SNI-based routing: match SNI host and route raw TLS to dashboard svc:443
    - match:
      - port: 443
        sniHosts:
          - "${K8S_ENVIRONMENT}.dashboard.slainte.at"
      route:
      - destination:
          host: kubernetes-dashboard-kong-proxy.kubernetes-dashboard.svc.cluster.local   # Kubernetes 1.33
          port:
            number: 443
---