---
# ServiceEntry declaring external Ceph endpoints (static resolution)
apiVersion: networking.istio.io/v1beta1
kind: ServiceEntry
metadata:
  name: rook-ceph-external-se
  namespace: istio-system
spec:
  hosts:
    - rook-ceph-external.local
  addresses:
    - 192.168.0.191/32
    - 192.168.0.192/32
    - 192.168.0.193/32
    - 192.168.0.194/32
  ports:
    - number: 6789
      name: ceph-mon
      protocol: TCP
    - number: 6800
      name: ceph-osd
      protocol: TCP
    - number: 443
      name: https
      protocol: HTTPS
  resolution: STATIC
  location: MESH_EXTERNAL
  endpoints:
    - address: 192.168.0.191
    - address: 192.168.0.192
    - address: 192.168.0.193
    - address: 192.168.0.194
---
# Headless Service + manual Endpoints for in-cluster DNS resolution
apiVersion: v1
kind: Service
metadata:
  name: rook-ceph-external
  namespace: istio-system
  labels:
    app: rook-ceph-external
spec:
  clusterIP: None
  ports:
    - name: ceph-mon
      port: 6789
      protocol: TCP
    - name: ceph-osd
      port: 6800
      protocol: TCP
    - name: https
      port: 443
      protocol: TCP
---
# Egress Gateway (in istio-system, selector matches egressgateway pods)
apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: rook-ceph-egress-gateway
  namespace: istio-system
spec:
  selector:
    istio: egressgateway
  servers:
    - port:
        number: 6789
        name: ceph-mon
        protocol: TCP
      hosts:
        - rook-ceph-external.local
    - port:
        number: 6800
        name: ceph-osd
        protocol: TCP
      hosts:
        - rook-ceph-external.local
    - port:
        number: 443
        name: https
        protocol: TCP
      hosts:
        - rook-ceph-external.local
---
# VirtualService in istio-system: route from egress gateway to external endpoints
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: rook-ceph-egress-routing
  namespace: istio-system
spec:
  hosts:
    - rook-ceph-external.local
  gateways:
    - "istio-system/rook-ceph-egress-gateway"
  tcp:
    - match:
        - port: 6789
      route:
        - destination:
            host: rook-ceph-external.local
            port:
              number: 6789
    - match:
        - port: 6800
      route:
        - destination:
            host: rook-ceph-external.local
            port:
              number: 6800
    - match:
        - port: 443
      route:
        - destination:
            host: rook-ceph-external.local
            port:
              number: 443
---
# DestinationRule for the external host (TLS origination optional)
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: rook-ceph-external-dr
  namespace: istio-system
spec:
  host: rook-ceph-external.local
  trafficPolicy:
    connectionPool:
      tcp:
        maxConnections: 100
    outlierDetection:
      consecutive5xxErrors: 5
      interval: 30s
      baseEjectionTime: 30s
  # TLS origination (optional): uncomment if you want egress gateway to originate TLS to Ceph
  # tls:
  #   mode: SIMPLE
  #   sni: rook-ceph-external.local
---
# VirtualService in rook-ceph namespace: route mesh traffic to egress gateway
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: rook-ceph-mesh-routing
  namespace: rook-ceph
spec:
  hosts:
    - rook-ceph-external.local
  gateways:
    - mesh
  tcp:
    - match:
        - port: 6789
      route:
        - destination:
            host: istio-egressgateway.istio-system.svc.cluster.local
            port:
              number: 6789
    - match:
        - port: 6800
      route:
        - destination:
            host: istio-egressgateway.istio-system.svc.cluster.local
            port:
              number: 6800
    - match:
        - port: 443
      route:
        - destination:
            host: istio-egressgateway.istio-system.svc.cluster.local
            port:
              number: 443
---
# Sidecar in rook-ceph namespace: restrict egress to local services + system namespaces + external Ceph host
apiVersion: networking.istio.io/v1beta1
kind: Sidecar
metadata:
  name: rook-ceph-egress-sidecar
  namespace: rook-ceph
spec:
  egress:
    - hosts:
        - "./*"                      # services in rook-ceph namespace
        - "istio-system/*"           # system services (including egressgateway)
        - "kube-system/*"
        - "istio-system/rook-ceph-external.local" # external Ceph endpoints
---