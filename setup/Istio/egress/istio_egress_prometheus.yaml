---
# ServiceEntry declaring external Prometheus endpoints (static resolution)
apiVersion: networking.istio.io/v1beta1
kind: ServiceEntry
metadata:
  name: prometheus-ceph-external-se
  namespace: istio-system
spec:
  hosts:
    - prometheus-ceph-external.local
  addresses:
    - 192.168.0.191/32
    - 192.168.0.192/32
    - 192.168.0.193/32
    - 192.168.0.194/32
  ports:
    - number: 9283
      name: http-prom
      protocol: HTTP
  resolution: STATIC
  location: MESH_EXTERNAL
  endpoints:
    - address: 192.168.0.191
    - address: 192.168.0.192
    - address: 192.168.0.193
    - address: 192.168.0.194
---
# Headless Service + manual Endpoints for in-cluster DNS resolution
apiVersion: v1
kind: Service
metadata:
  name: prometheus-ceph-external
  namespace: istio-system
  labels:
    app: prometheus-ceph-external
spec:
  clusterIP: None
  ports:
    - name: http-prom
      port: 9283
      protocol: TCP
---
# Egress Gateway (in istio-system, selector matches egressgateway pods)
apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: prometheus-egress-gateway
  namespace: istio-system
spec:
  selector:
    istio: egressgateway
  servers:
    - port:
        number: 9283
        name: http-prom
        protocol: HTTP
      hosts:
        - prometheus-ceph-external.local
---
# VirtualService in istio-system: route from egress gateway to external endpoints
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: prometheus-egress-routing
  namespace: istio-system
spec:
  hosts:
    - prometheus-ceph-external.local
  gateways:
    - "istio-system/prometheus-egress-gateway"
  http:
    - match:
        - uri:
            prefix: /
      route:
        - destination:
            host: prometheus-ceph-external.local
            port:
              number: 9283
---
# DestinationRule for the external host (connection pool + outlier detection)
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: prometheus-ceph-external-dr
  namespace: istio-system
spec:
  host: prometheus-ceph-external.local
  trafficPolicy:
    connectionPool:
      tcp:
        maxConnections: 100
      http:
        http1MaxPendingRequests: 100
        maxRequestsPerConnection: 2
    outlierDetection:
      consecutive5xxErrors: 5
      interval: 30s
      baseEjectionTime: 30s
  # TLS origination (optional): uncomment if you want egress gateway to originate TLS
  # tls:
  #   mode: SIMPLE
  #   sni: prometheus-ceph-external.local
---
# VirtualService in observability namespace: route mesh traffic to egress gateway
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: prometheus-mesh-routing
  namespace: observability
spec:
  hosts:
    - prometheus-ceph-external.local
  gateways:
    - mesh
  http:
    - match:
        - uri:
            prefix: /
      route:
        - destination:
            host: istio-egressgateway.istio-system.svc.cluster.local
            port:
              number: 9283
---
# Sidecar in observability namespace: restrict egress to local services + system namespaces + external Prometheus host
apiVersion: networking.istio.io/v1beta1
kind: Sidecar
metadata:
  name: prometheus-egress-sidecar
  namespace: observability
spec:
  egress:
    - hosts:
        - "./*"                             # services in observability namespace
        - "istio-system/*"                  # system services (including egressgateway)
        - "kube-system/*"
        - "istio-system/prometheus-ceph-external.local"  # external Prometheus endpoints
---