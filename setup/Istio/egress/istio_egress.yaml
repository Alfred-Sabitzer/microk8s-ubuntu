# Istio Egress Gateway + routing to ensure rook-ceph external hosts are accessed
# via the egress gateway. Adjust hostnames, ports and TLS origination settings
# to match your environment.
#
# Pattern:
# 1) Workload VirtualService (in rook-ceph namespace, mesh gateway) routes traffic
#    for rook-ceph-external.local to the egress gateway service.
# 2) Egress Gateway (istio-system) accepts forwarded traffic and a VirtualService
#    (in istio-system) routes the traffic from the gateway to the external ServiceEntry.
# 3) DestinationRule is provided for the external host in case TLS origination is required.
---
# ServiceEntry for the external Ceph hosts.
# Adjust IPs and ports to match your external Ceph deployment.
apiVersion: networking.istio.io/v1alpha3
kind: ServiceEntry
metadata:
  name: rook-ceph-external-se
  namespace: rook-ceph
spec:
  hosts:
    - "rook-ceph-external.local"
  addresses:
    - 192.168.0.191/32
    - 192.168.0.192/32
    - 192.168.0.193/32
    - 192.168.0.194/32
  ports:
    - number: 6789
      name: ceph-mon
      protocol: TCP
    - number: 6800
      name: ceph-osd
      protocol: TCP
    - number: 9283
      name: prometheus
      protocol: TCP
    - number: 80
      name: http
      protocol: HTTP
    - number: 443
      name: https
      protocol: HTTPS
  resolution: STATIC
  location: MESH_EXTERNAL
  endpoints:
    - address: 192.168.0.191
    - address: 192.168.0.192
    - address: 192.168.0.193
    - address: 192.168.0.194
---
apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: rook-ceph-egress-vs
  namespace: rook-ceph
spec:
  # logical host used by workloads (matches ServiceEntry host)
  hosts:
    - "rook-ceph-external.local"
  # use the mesh gateway so that requests from sidecars in rook-ceph will be routed
  # to the egress gateway service
  gateways:
    - mesh
  http:
    - match:
        - uri:
            prefix: /
      route:
        - destination:
            host: istio-egressgateway.istio-system.svc.cluster.local
            port:
              number: 80
      # preserve original host header / SNI by forwarding; outbound connections from the
      # egress gateway will use the SNI from the Host header
      headers:
        request:
          set:
            # ensure the host header remains the external host
            host: "rook-ceph-external.local"
---
# Egress Gateway (Gateway resource) in istio-system namespace.
# This instructs the ingress/egress gateway Envoy to accept traffic for the external host.
apiVersion: networking.istio.io/v1alpha3
kind: Gateway
metadata:
  name: rook-egress-gateway
  namespace: istio-system
spec:
  selector:
    # this must match the labels on the egress gateway workload (if you run the
    # standard Istio egressgateway addon, check its labels; common label is "istio=egressgateway")
    istio: egressgateway
  servers:
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - "rook-ceph-external.local"
    - port:
        number: 443
        name: https
        protocol: HTTPS
      hosts:
        - "rook-ceph-external.local"
      tls:
        # when egress gateway performs TLS origination toward external service,
        # use SIMPLE and set credentialName to the secret with client cert/key (if needed).
        # If you do not want the gateway to originate TLS, leave TLS block out and use passthrough/ServiceEntry.
        mode: SIMPLE
        credentialName: rook-egress-client-tls   # optional: Kubernetes secret in istio-system
---
# VirtualService in istio-system to handle traffic routed to the egress gateway
# and forward it to the external ServiceEntry (resolution STATIC endpoints).
apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: rook-egress-routing
  namespace: istio-system
spec:
  hosts:
    - "rook-ceph-external.local"
  gateways:
    - "istio-system/rook-egress-gateway"
  http:
    - match:
        - uri:
            prefix: /
      route:
        - destination:
            host: "rook-ceph-external.local"   # ServiceEntry host
            port:
              number: 80
---
# DestinationRule for the external host. Use this to configure TLS origination
# from the egress gateway to the external endpoints. If the external Ceph endpoints
# expect plain TCP/HTTP, remove or adapt the TLS block.
apiVersion: networking.istio.io/v1alpha3
kind: DestinationRule
metadata:
  name: rook-ceph-external-dr
  namespace: istio-system
spec:
  host: "rook-ceph-external.local"
  trafficPolicy:
    # Example TLS origination: enable SIMPLE TLS from egress gateway to external host.
    # If you want mTLS (client cert) from the egress gateway, use tls.mode: MUTUAL
    # and configure credentialName on the Gateway (secret in istio-system).
    tls:
      mode: SIMPLE
      # optional: sni - set to external hostname if required
      sni: "rook-ceph-external.local"
---
apiVersion: networking.istio.io/v1beta1
kind: Sidecar
metadata:
  name: rook-ceph-egress-sidecar
  namespace: rook-ceph
spec:
  # No workloadSelector -> applies to all workloads in the rook-ceph namespace
  egress:
    - hosts:
        - "./*" # Allow access to services in the same namespace
        - "istio-system/*"  # Allow access to essential cluster system namespaces (adjust if you want to restrict)
        - "kube-system/*"
        - "rook-ceph/rook-ceph-external.local"  # Allow access to the external Ceph host defined above
---
