---
# This is just an ubuntu pod that can be used to test egress traffic
# to external services from within the mesh.
# It installs curl and ping so that you can test connectivity.
# It is deployed in the rook-ceph namespace to test egress
# policies that are namespace specific
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: ubuntu
    storage: rook
  name: ubuntu
  namespace: rook-ceph
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ubuntu
  template:
    metadata:
      labels:
        app: ubuntu
    spec:
      containers:
      - image: ubuntu:noble
        name: ubuntu
        command:
          - sh
          - -c
          - |
            while true; do
              echo 'Hello, World!'
              apt-get update -y
              apt-get install curl iputils-ping -y
              sleep 300
            done
---