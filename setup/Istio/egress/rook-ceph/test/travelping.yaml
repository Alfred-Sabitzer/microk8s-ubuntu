---
# This is for testing purposes. Login and try to ping and curl and so on.
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: travelping
  name: travelping
  namespace: rook-ceph
spec:
  replicas: 1
  selector:
    matchLabels:
      app: travelping
  template:
    metadata:
      labels:
        app: travelping
    spec:
      containers:
      - image: travelping/nettools:1.11.0-pre1
        name: travelping
        command: ["sh", "-c", "while true; do echo 'Hello, World!'; sleep 5; done"]
---