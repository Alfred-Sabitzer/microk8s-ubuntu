# https://cert-manager.io/docs/usage/certificate/
---
# The Certificate should be created in the same namespace as the istio-ingressgateway deployment.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: http-echo-simple-slainte-at
  namespace: istio-system
spec:
  isCA: false
  # Avoid using commonName for DNS names in end-entity (leaf) certificates. Unless you have a specific
  # need for it in your environment, use dnsNames exclusively to avoid issues with commonName.
  # Usually, commonName is used to give human-readable names to CA certificates and can be avoided for
  # other certificates.
  #commonName: httpecho
  secretName: http-echo-simple-slainte-at
  duration: 2160h        # 90 days
  renewBefore: 360h      # 15 days
  privateKey:
    algorithm: RSA
    encoding: PKCS1
    size: 2048
    rotationPolicy: Always
  issuerRef:
    name: k8s-ca-issuer
    kind: ClusterIssuer
    group: cert-manager.io
  dnsNames:
    - ${K8S_ENVIRONMENT}.http-echo-simple.slainte.at
  emailAddresses:
    - slainte@slainte.at
  # Needs cert-manager 1.14+ and "OtherNames" feature flag
  subject:
    organizations:
      - http-echo-simple-slainte-at
    organizationalUnits:
      - ${K8S_ENVIRONMENT}
  usages:
    - digital signature
    - key encipherment
    - server auth
---
