---
# HTTPS Routing für http-echo Service (Gateway API)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: http-echo-route
  namespace: demo-istio

spec:
  parentRefs:
  - name: slainte-edge
    namespace: istio-gateways
    sectionName: https-wildcard-mtls
  hostnames:
  - "${K8S_ENVIRONMENT}.http-echo.slainte.at"

  rules:
  - backendRefs:
    - group: ""
      kind: Service
      name: http-echo
      namespace: demo-istio
      port: 80
      weight: 1
    matches:
    - path:
        type: PathPrefix
        value: /
