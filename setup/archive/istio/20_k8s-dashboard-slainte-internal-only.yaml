---
# HTTPRoute to redirect HTTP requests to HTTPS for ${K8S_ENVIRONMENT}.dashboard.slainte.at
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: dashboard-http-redirect
  namespace: istio-system
spec:
  parentRefs:
  - name: dashboard-gateway
    sectionName: http

  hostnames:
  - "${K8S_ENVIRONMENT}.dashboard.slainte.at"

  rules:
  - filters:
    - type: RequestRedirect
      requestRedirect:
        scheme: https
        statusCode: 301
---
# TLS wird vollständig vom Dashboard gehandhabt
# Istio sieht nur SNI, kein HTTP
apiVersion: gateway.networking.k8s.io/v1alpha2
kind: TCPRoute
metadata:
  name: dashboard-tls-route
  namespace: kubernetes-dashboard
spec:
  parentRefs:
  - name: dashboard-gateway
    namespace: istio-system
    sectionName: https

  rules:
  - backendRefs:
    - name: kubernetes-dashboard-kong-proxy
      port: 443
---
#Istio PeerAuthentication (STRICT mTLS intern)
apiVersion: security.istio.io/v1beta1
kind: PeerAuthentication
metadata:
  name: dashboard-mtls
  namespace: kubernetes-dashboard
spec:
  mtls:
    mode: STRICT
---