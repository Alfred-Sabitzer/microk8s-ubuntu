---
# Why cephfs StorageClass is missing
# MicroK8s does not auto-create CephFS StorageClasses for external clusters.
# Even though the CSI drivers are running, you must create it manually.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: cephfs
provisioner: rook-ceph.cephfs.csi.ceph.com
parameters:
  clusterID: rook-ceph-external
  fsName: ${CEPHFS_FS_NAME}
  pool: ${CEPHFS_POOL_NAME}
  csi.storage.k8s.io/provisioner-secret-name: rook-csi-cephfs-provisioner
  csi.storage.k8s.io/provisioner-secret-namespace: rook-ceph-external
  csi.storage.k8s.io/node-stage-secret-name: rook-csi-cephfs-node
  csi.storage.k8s.io/node-stage-secret-namespace: rook-ceph-external
reclaimPolicy: Delete
allowVolumeExpansion: true
volumeBindingMode: Immediate
---
# Essential Secrets for node-access
apiVersion: v1
data:
  userID: ${base64_CSI_CEPHFS_NODE_SECRET_NAME}
  userKey: ${base64_CSI_CEPHFS_NODE_SECRET}
kind: Secret
metadata:
  name: rook-csi-cephfs-node
  namespace: rook-ceph-external
type: kubernetes.io/rook
---
# Essential Secrets for cephfs-access
apiVersion: v1
data:
  userID: ${base64_CSI_CEPHFS_PROVISIONER_SECRET_NAME}
  userKey: ${base64_CSI_CEPHFS_PROVISIONER_SECRET}
kind: Secret
metadata:
  name: rook-csi-cephfs-provisioner
  namespace: rook-ceph-external
type: kubernetes.io/rook
---