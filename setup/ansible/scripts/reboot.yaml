-
  name: 'Playbook for rebooting cluster and wait for connection'
  hosts: microcloud
  become: True
  become_method: sudo
  tasks:
    - name: Reboot nodes and send a message
      ansible.builtin.reboot:
        msg: "Rebooting node in 5 seconds"
    - name: Wait max. 300 seconds, start checking after 15 seconds
      ansible.builtin.wait_for_connection:
        delay: 15
        timeout: 300