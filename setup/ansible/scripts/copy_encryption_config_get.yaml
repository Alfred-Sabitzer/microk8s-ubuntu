-
  name: 'Playbook for synching encryption config from master to other nodes'
  become: True
  hosts: k8s1
  become_method: sudo
  tasks:
    - name: Store file into /tmp/encryption-config
      ansible.builtin.fetch:
        src: /var/snap/microk8s/current/args/encryption-config
        dest: /tmp/encryption-config
