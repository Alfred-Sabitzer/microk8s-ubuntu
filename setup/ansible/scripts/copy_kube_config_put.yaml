-
  name: 'Playbook for synching encryption config from master to other nodes'
  become: True
  hosts: k8s
  become_method: sudo
  tasks:
    - name: Copy file with owner and permissions
      ansible.builtin.copy:
        src: /tmp/kube-config/k8s1/home/ansible/.kube/config
        dest: /home/ansible/.kube/config
        owner: ansible
        group: ansible
        mode: '0664'
