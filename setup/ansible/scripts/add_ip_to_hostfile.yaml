-
  name: 'Playbook for adding all hosts into /etc/hosts'
  hosts: microcloud
  become: True
  become_method: sudo
  tasks:
   - name: Add Ansible inventory mappings to /etc/hosts
     blockinfile:
       path: /etc/hosts
       block: |
         {% for host in groups['all'] %}
         {{ hostvars[host].ansible_host }} {{ host }}
         {% endfor %}
