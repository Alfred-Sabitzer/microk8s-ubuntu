-
  name: 'Ändern des localhost Namens auf den richtigen Namen aus dem ansible-repository'
  hosts: all
  become: yes
  become_method: sudo
  tasks:
    - name: 'Change localhost in /etc/hosts'
      lineinfile:
        path: /etc/hosts
        regexp: '^127\.0\.0\.1[ \t]+localhost'
        line: '127.0.0.1 localhost {{ inventory_hostname }}'
        state: present
