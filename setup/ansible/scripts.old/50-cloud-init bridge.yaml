network:
  version: 2
  ethernets:
    eno1:
      dhcp4: no
      dhcp6: no
      addresses: [192.168.0.194/24] # Replace with your desired static IP and subnet mask
      routes:
        - to: default
          via: 192.168.0.1 # Replace with your gateway IP
      nameservers:
          addresses: [87.243.128.30, 78.152.93.30] # Replace with your desired DNS servers

  bridges:
    bridge0:
      interfaces:
        - eno1
      dhcp4: yes
      dhcp6: yes
