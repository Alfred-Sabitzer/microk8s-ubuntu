-
  name: 'Aufnahme des monitoring-Servers in /etc/hosts'
  hosts: all
  become: True
  become_method: sudo
  tasks:
    - name: 'add monitoring-server to /etc/hosts'
      lineinfile:
        path: /etc/hosts
        regexp: '192.168.0.2 monitoring'
        line: '192.168.0.2 monitoring'
        state: present
