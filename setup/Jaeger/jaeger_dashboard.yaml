apiVersion: networking.istio.io/v1alpha3
kind: Gateway
metadata:
  name: jaeger-gateway
  namespace: istio-system
spec:
  selector:
    istio: ingressgateway
  servers:
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - "jaeger.slainte.at"   # replace with your hostname or use "*"
---
# VirtualService to route host-based traffic to Jaeger UI (jaeger-query svc)
apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: jaeger-vs
  namespace: jaeger
spec:
  hosts:
    - "jaeger.slainte.at"    # must match Gateway host
  gateways:
    - "istio-system/jaeger-kiali-gateway"
  http:
    - match:
        - uri:
            prefix: /
      route:
        - destination:
            host: jaeger-query.jaeger.svc.cluster.local
            port:
              number: 16686
---