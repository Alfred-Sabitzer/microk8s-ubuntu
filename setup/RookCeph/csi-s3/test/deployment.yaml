---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ceph-s3-pvc
  namespace: test
spec:
  accessModes:
    - ReadWriteMany # S3 erlaubt standardmäßig den Zugriff von vielen Pods gleichzeitig
  storageClassName: csi-s3 # Verweis auf die StorageClass, die den S3-CSI-Treiber verwendet
  resources:
    requests:
      # Da S3 unendlich skaliert, ist die Angabe für Ceph rein symbolisch für K8s
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: csi-s3-app
  namespace: test
  labels:
    app: s3-client
spec:
  replicas: 1
  selector:
    matchLabels:
      app: s3-client
  template:
    metadata:
      labels:
        app: s3-client
    spec:
      containers:
      # The image below is signed and should pass the Kyverno policy check for signed images. Change the uid accordingly if you want to test with a different image.
      - image: harbor.test.slainte.at/test/dummy@sha256:7e5e1104b30896536f6073e1d474117f88d6ed3fbcaa6e3c5d344166fcff1d44
        name: app-container
        imagePullPolicy: IfNotPresent
        command: ["/bin/sh", "-c", "while true; do sleep 30; done"] # Hält den Container aktiv
        volumeMounts:
        - name: s3-volume
          mountPath: /var/meine-app/daten # Hier wird dein Ceph-Bucket als Ordner sichtbar!
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          privileged: false
          readOnlyRootFilesystem: true
      dnsPolicy: ClusterFirst
      securityContext:
        fsGroup: 10001
        runAsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      volumes:
      - name: s3-volume
        persistentVolumeClaim:
          claimName: ceph-s3-pvc # Verweis auf das PVC von oben
      - emptyDir: {}
        name: tmp-volume
      imagePullSecrets:
      - name: harbor-pull
---