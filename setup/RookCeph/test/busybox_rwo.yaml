---
# busybox.yaml
# Deploys a BusyBox pod to test Ceph RBD PVC provisioning and encryption.
kind: Namespace
apiVersion: v1
metadata:
  name: test
  labels:
    kubernetes.io/metadata.name: test
spec:
  finalizers:
    - kubernetes
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rookrbd
  namespace: test
  labels:
    app: bbrookrwo
    storage: rook
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ceph-rbd
  resources:
    requests:
      storage: 10G
---
# This is an example of a Kubernetes Deployment that uses a PersistentVolumeClaim on ceph shared storage.
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: bbrookrwo
    storage: rook
  name: bbrookrwo
  namespace: test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bbrookrwo
  template:
    metadata:
      labels:
        app: bbrookrwo
    spec:
      containers:
      - image: busybox:latest
        name: bbrookrwo
        command: ["sh", "-c", "while true; do echo 'Hello, World!'; sleep 5; done"]
        volumeMounts:
          - name: rook
            mountPath: "/mnt/rook"
      volumes:
      - name: rook
        persistentVolumeClaim:
          claimName: rookrbd
---