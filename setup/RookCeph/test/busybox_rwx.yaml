---
# busybox.yaml
# Deploys a BusyBox pod to rook-ceph Ceph RBD PVC provisioning and encryption.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rookrwx
  namespace: rook-ceph
  labels:
    app: rookrwx
    storage: rook
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: cephfs
  resources:
    requests:
      storage: 10G
---
# This is an example of a Kubernetes Deployment that uses a PersistentVolumeClaim on ceph shared storage.
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: rookrwx
    storage: rook
  name: rookrwx
  namespace: rook-ceph
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rookrwx
  template:
    metadata:
      labels:
        app: rookrwx
    spec:
      containers:
      #- image: busybox:latest
      - image: ubuntu:noble
        name: rookrwx
        command:
          - sh
          - -c
          - |
            sleep 10
            while true; do
              echo 'observability-rbd alive'
              echo $(date +"%Y%m%d %HH:%mm") [`hostname`] ' observability-cephfs alive'  >> /mnt/rook/hello.txt
              sleep 30
            done
        volumeMounts:
          - name: rook
            mountPath: "/mnt/rook"
      volumes:
      - name: rook
        persistentVolumeClaim:
          claimName: rookrwx
---