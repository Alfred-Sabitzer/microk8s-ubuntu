apiVersion: v1
kind: ServiceAccount
metadata:
  name: rook-ceph-external-sa
  namespace: rook-ceph-external
  labels:
    app.kubernetes.io/managed-by: keepass-to-eso-openbao-py
  annotations:
    openbao.mount: rook-ceph-external
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rook-ceph-external-writer
  namespace: rook-ceph-external
  labels:
    security: cis
    app.kubernetes.io/managed-by: keepass-to-eso-openbao-py
  annotations:
    openbao.mount: rook-ceph-external
rules:
  - apiGroups:
      - ''
    resources:
      - pods
    verbs:
      - get
  - apiGroups:
      - secrets-store.csi.x-k8s.io
    resources:
      - secretproviderclasses
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - secrets-store.csi.x-k8s.io
    resources:
      - secretproviderclasspodstatuses
    verbs:
      - create
      - get
      - update
      - patch
  - apiGroups:
      - ''
    resources:
      - events
    verbs:
      - create
      - patch
  - apiGroups:
      - ''
    resources:
      - secrets
    verbs:
      - create
      - update
      - patch
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rook-ceph-external-swb
  namespace: rook-ceph-external
  labels:
    app.kubernetes.io/managed-by: keepass-to-eso-openbao-py
  annotations:
    openbao.mount: rook-ceph-external
roleRef:
  kind: Role
  name: rook-ceph-external-writer
  apiGroup: rbac.authorization.k8s.io
subjects:
  - kind: ServiceAccount
    name: rook-ceph-external-sa
    namespace: rook-ceph-external
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: rook-ceph-external-eso
  namespace: rook-ceph-external
  labels:
    app.kubernetes.io/managed-by: keepass-to-eso-openbao-py
  annotations:
    openbao.mount: rook-ceph-external
    external-secrets.io/ignore-maintenance-checks: 'true'
spec:
  provider:
    vault:
      server: http://openbao.openbao.svc:8200
      version: v2
      path: secret
      auth:
        kubernetes:
          mountPath: kubernetes
          role: rook-ceph-external-role
          serviceAccountRef:
            name: rook-ceph-external-sa
