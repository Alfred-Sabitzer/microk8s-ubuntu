---
apiVersion: objectstorage.k8s.io/v1alpha2
kind: BucketClaim
metadata:
  name: my-app-bucket-claim
  namespace: test
spec:
  bucketClassName: ceph-external-bucketclass
  protocols:
    - S3 # Wichtig: Muss zwingend großgeschrieben werden!
---
apiVersion: objectstorage.k8s.io/v1alpha2
kind: BucketAccess
metadata:
  name: my-app-bucket-access
  namespace: test
spec:
  bucketAccessClassName: ceph-external-accessclass
  protocol: S3
  bucketClaims:
    - bucketClaimName: my-app-bucket-claim
      accessModes:
        bucketMetadata: ReadWrite
        objectData: ReadWrite
        objectMetadata: ReadWrite
      accessSecretName: cosi-s3-credentials
---