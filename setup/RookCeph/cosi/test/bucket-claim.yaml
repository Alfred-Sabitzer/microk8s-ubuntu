---
apiVersion: objectstorage.k8s.io/v1alpha1
kind: BucketClaim
metadata:
  name: my-app-bucket-claim
  namespace: test
spec:
  bucketClassName: ceph-external-bucketclass
  protocols:
    - S3 # Wichtig: Muss zwingend großgeschrieben werden!
---
apiVersion: objectstorage.k8s.io/v1alpha1
kind: BucketAccess
metadata:
  name: my-app-bucket-access
  namespace: test
spec:
  bucketAccessClassName: ceph-external-accessclass
  bucketClaimName: my-app-bucket-claim
  protocol: S3
  credentialsSecretName: cosi-s3-credentials
---