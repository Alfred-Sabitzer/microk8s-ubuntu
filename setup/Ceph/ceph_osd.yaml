# ceph_osd.yaml
# Purpose: Add OSDs to Ceph cluster using cephadm orchestration.
# Ensure all referenced devices exist and are not in use.

- name: Add OSDs to Ceph cluster
  hosts: all
  become: true
  tasks:
    - name: Add OSD daemon
      shell: |
        sudo ceph orch daemon add osd {{ inventory_hostname }}:/dev/{{ osd_device }}
      args:
        warn: false
      register: osd_add_result
    - name: Show OSD add result
      debug:
        var: osd_add_result.stdout