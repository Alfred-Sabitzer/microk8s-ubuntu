---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: duplicity
  namespace: velero
  labels:
    app: duplicity
spec:
  replicas: 1

  selector:
    matchLabels:
      app: duplicity

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: duplicity

    spec:
      serviceAccountName: velero-sa

      # Keine Kubernetes-API-Credentials automatisch mounten
      automountServiceAccountToken: false

      terminationGracePeriodSeconds: 30

      hostNetwork: false
      hostPID: false
      hostIPC: false

      imagePullSecrets:
        - name: harbor-pull

      # Pod-Level Security
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: duplicity
          image: harbor.test.slainte.at/velero/duplicity@sha256:a12d2fc4a5fda1e04bf7b527e05c76176b3dc3d542865283d8b247877341f5f7
          imagePullPolicy: IfNotPresent

          # Wichtig: Ohne 'while true', damit sich der Pod nach Ausführung beendet!
          command:
            - sh
            - -c
            - |
              while true; do
                date
                ls -la /mnt/
                sleep 5
              done

          # Container-Level Security
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            capabilities:
              drop:
                - ALL

          resources:
            requests:
              cpu: 250m
              memory: 512Mi
              ephemeral-storage: 1Gi
            limits:
              cpu: "1"
              memory: 1Gi
              ephemeral-storage: 2Gi


          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp

            - name: duplicity-backup-credentials
              mountPath: /mnt/duplicity-backup-credentials
              readOnly: true

            - name: duplicity-ssh
              mountPath: /mnt/duplicity-ssh
              readOnly: true

            - name: duplicity-pvc
              mountPath: /mnt/duplicity-pvc

            - name: home-volume
              mountPath: /home/duplicity

            - name: backup-storage
              mountPath: /mnt/source
              readOnly: true

      volumes:
        - name: tmp-volume
          emptyDir:
            medium: Memory
            sizeLimit: 32Mi

        - name: duplicity-backup-credentials
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: duplicity-backup-credentials
              filePermission: "0400"

        - name: duplicity-ssh
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: duplicity-ssh
              filePermission: "0400"

        - name: duplicity-pvc
          persistentVolumeClaim:
            claimName: duplicity-pvc

        - name: home-volume
          emptyDir:
            medium: Memory
            sizeLimit: 32Mi

        - name: backup-storage
          persistentVolumeClaim:
            claimName: ceb81ea47db-d4e1-4738-ab65-f5e65a8f6bf1
---