apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: velero-bucket
  namespace: velero
  labels:
    app.kubernetes.io/managed-by: keepass-to-eso-openbao-py
  annotations:
    keepassxc.folderPath: root-velero
    keepassxc.database: home-alfred-kdbx-kdbx-k8stest-kdbx
    openbao.mount: kv
    openbao.key: velero-velero-bucket
spec:
  provider: openbao
  parameters:
    openbaoAddress: http://openbao.openbao.svc:8200
    openbaoKVVersion: '2'
    roleName: velero-role
    objects: |2-
        - objectName: cloud
          secretPath: secret/data/velero/velero-bucket
          secretKey: cloud
  secretObjects:
    - secretName: velero-bucket
      type: Opaque
      labels:
        managed-by: openbao-csi
      data:
        - objectName: cloud
          key: cloud
