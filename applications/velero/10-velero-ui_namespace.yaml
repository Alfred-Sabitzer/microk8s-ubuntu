---
apiVersion: v1
kind: Namespace
metadata:
  name: velero-ui
  labels:
    kubernetes.io/metadata.name: velero-ui
    name: velero-ui
    istio.io/dataplane-mode: ambient
    istio-injection: disabled
    monitoring: enabled
    # Namespaces can be labeled to enforce the Pod Security Standards. 
    # The three policies privileged, baseline and restricted broadly cover the security spectrum and are implemented by the Pod Security admission controller
    pod-security.kubernetes.io/enforce: baseline
spec:
  finalizers:
    - kubernetes
---