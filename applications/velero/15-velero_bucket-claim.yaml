---
apiVersion: objectstorage.k8s.io/v1alpha1
kind: BucketClaim
metadata:
  name: velero-bucket-claim
  namespace: velero
spec:
  bucketClassName: ceb
  protocols:
    - S3 # Wichtig: Muss zwingend großgeschrieben werden!
---
apiVersion: objectstorage.k8s.io/v1alpha1
kind: BucketAccess
metadata:
  name: velero-bucket-access
  namespace: velero
spec:
  bucketAccessClassName: cea
  bucketClaimName: velero-bucket-claim
  protocol: S3
  credentialsSecretName: velero-s3-credentials
---