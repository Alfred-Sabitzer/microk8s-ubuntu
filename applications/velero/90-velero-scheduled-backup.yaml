---
# Backup all namespaces every day at 2am, keep for 3 days.
apiVersion: velero.io/v1
kind: Schedule
metadata:
  name: velero-scheduled-backup
  namespace: velero
spec:
  paused: false
  schedule: CRON_TZ=Europe/Vienna 0 2 * * *
  skipImmediately: false
  template:  
    csiSnapshotTimeout: 10m0s
    defaultVolumesToFsBackup: true
    excludedNamespaces:
      - default
      - rook-ceph-external
    excludedResources:
      - volumesnapshots.snapshot.storage.k8s.io
      - volumesnapshotcontents.snapshot.storage.k8s.io
    includeClusterResources: true
    includedNamespaces:
      - "*"
    includedResources:
      - "*"
    itemOperationTimeout: 4h0m0s
    snapshotMoveData: true
    snapshotVolumes: true
    storageLocation: velero-backup-storage-location
    ttl: 72h
    volumeGroupSnapshotLabelKey: velero.io/volume-group
    volumeSnapshotLocations:
      - velero-snapshot-location
  useOwnerReferencesInBackup: true