---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  annotations:
    {{- include "duplicati.annotations" . | nindent 4 }}
  labels:
    {{- include "duplicati.labels" . | nindent 4 }}
spec:
  storageClassName: {{ .Values.dataPvc.storageClassName }}
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.dataPvc.size }}
---  