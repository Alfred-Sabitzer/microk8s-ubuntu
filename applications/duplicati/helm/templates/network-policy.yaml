{{- if .Values.networkPolicy.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-deny-all
  namespace: {{ .Release.Namespace }}
  annotations:
    {{- include "duplicati.annotations" . | nindent 4 }}
  labels:
    {{- include "duplicati.labels" . | nindent 4 }}

spec:
  podSelector:
    matchLabels:
      app: {{ .Release.Name }}

  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-allow-dns
  namespace: {{ .Release.Namespace }}
  annotations:
    {{- include "duplicati.annotations" . | nindent 4 }}
  labels:
    {{- include "duplicati.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: {{ .Release.Name }}

  policyTypes:
    - Egress

  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-allow-omv
  namespace: {{ .Release.Namespace }}
  annotations:
    {{- include "duplicati.annotations" . | nindent 4 }}
  labels:
    {{- include "duplicati.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: {{ .Release.Name }}

  policyTypes:
    - Egress

  egress:
    {{- range .Values.networkPolicy.sshCidrs }}
    - to:
        - ipBlock:
            cidr: {{ . | quote }}
      ports:
        - protocol: TCP
          port: {{ $.Values.networkPolicy.sshPort }}
    {{- end }}
{{- end }}