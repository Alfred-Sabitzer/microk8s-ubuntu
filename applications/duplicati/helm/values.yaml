replicaCount: 1

image:
  registry: harbor.test.slainte.at
  project: duplicity
  repository: duplicity
  tag: "20261121"
  digest: ""
  pullPolicy: IfNotPresent
  pullSecrets:
    - harbor-pull

buildInfo:
  tool: podman
  deployUnsecure: false

nameOverride: ""
fullnameOverride: ""

deployment:
  enabled: true
  restartPolicy: Always

cronJob:
  enabled: true
  restartPolicy: OnFailure
  schedule: "0 2 * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 1800
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3

job:
  backoffLimit: 3
  activeDeadlineSeconds: 21600
  ttlSecondsAfterFinished: 604800

serviceAccount:
  name: duplicity-sa
  automountServiceAccountToken: false

replicaCount: 1

networkPolicy:
  enabled: true
  sshCidrs:
    - 192.168.0.10/32
  sshPort: 22

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  privileged: false
  capabilities:
    drop:
      - ALL

hostNetwork: false
hostPID: false
hostIPC: false

resources:
  limits:
    cpu: "1000m"
    memory: "1024Mi"
  requests:
    cpu: "100m"
    memory: "128Mi"

nodeSelector: {}
tolerations: []
affinity: {}

####

service:
  port: 8200

persistence:
  enabled: true
  storageClass: microk8s-hostpath
  size: 10Gi

istio:
  enabled: true
  gateway: istio-system/main-gateway
  host: duplicati.example.com

resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    cpu: 2
    memory: 2Gi