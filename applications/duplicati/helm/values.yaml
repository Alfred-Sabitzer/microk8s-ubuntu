replicaCount: 1

image:
  repository: duplicati/duplicati
  tag: "2.4.1.0"
  pullPolicy: IfNotPresent

service:
  port: 8200

persistence:
  enabled: true
  storageClass: microk8s-hostpath
  size: 10Gi

istio:
  enabled: true
  gateway: istio-system/main-gateway
  host: duplicati.example.com

resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    cpu: 2
    memory: 2Gi