replicaCount: 1

image:
  registry: harbor.test.slainte.at
  project: duplicity
  repository: duplicity
  tag: "20261121"
  digest: ""
  pullPolicy: IfNotPresent
  pullSecrets:
    - harbor-pull

buildInfo:
  tool: podman
  deployUnsecure: false

service:
  port: 8200

persistence:
  enabled: true
  storageClass: microk8s-hostpath
  size: 10Gi

istio:
  enabled: true
  gateway: istio-system/main-gateway
  host: duplicati.example.com

resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    cpu: 2
    memory: 2Gi