---
# softhsm-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: softhsm
  namespace: ${NAMESPACE}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: softhsm
  template:
    metadata:
      labels:
        app: softhsm
    spec:
      containers:
      - name: softhsm
        image: alpine:3.23.3
        volumeMounts:
          - name: softhsm-data
            mountPath: /var/lib/softhsm
          - name: softhsm-config
            mountPath: /app
        env:
          - name: SOFTHSM2_CONF
            value: "/etc/softhsm2.conf"
        command: ['sh', '-c', 'echo The app is running! && sleep infinity']
      initContainers:
      - name: softhsminit
        image: alpine:3.23.3
        volumeMounts:
          - name: softhsm-data
            mountPath: /var/lib/softhsm
          - name: softhsm-config
            mountPath: /app
        env:
          - name: SOFTHSM2_CONF
            value: "/etc/softhsm2.conf"
        command:
          - "sh"
          - "-c"
          - "sh -x /app/softhsm.sh"
        #ports:
        #- containerPort: 8080
        # Note: The container does not need open ports unless you plan for remote mgmt
      volumes:
      - name: softhsm-data
        persistentVolumeClaim:
          claimName: softhsm-pvc
      - name: softhsm-lib
        emptyDir:  {}
      - name: softhsm-config
        configMap:
          name: softhsm
---