apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: obsync-k8ssecret
  namespace: eso-test
  labels:
    app.kubernetes.io/managed-by: keepass-to-eso-openbao-py
  annotations:
    keepassxc.folderPath: root-eso-test
    keepassxc.database: 
      home-alfred-github-microk8s-ubuntu-applications-eso-test-eso-kd
    openbao.mount: kv
    openbao.key: eso-test-obsync-k8ssecret
spec:
  provider: openbao
  parameters:
    openbaoAddress: http://openbao.openbao.svc:8200
    openbaoKVVersion: '2'
    roleName: eso-test-role
    objects: |2-
        - objectName: username
          secretPath: secret/data/eso-test/obsync-k8ssecret
          secretKey: username
        - objectName: password
          secretPath: secret/data/eso-test/obsync-k8ssecret
          secretKey: password
        - objectName: url
          secretPath: secret/data/eso-test/obsync-k8ssecret
          secretKey: url
        - objectName: notes
          secretPath: secret/data/eso-test/obsync-k8ssecret
          secretKey: notes
  secretObjects:
    - secretName: obsync-k8ssecret
      type: Opaque
      labels:
        managed-by: openbao-csi
      data:
        - objectName: username
          key: username
        - objectName: password
          key: password
        - objectName: url
          key: url
        - objectName: notes
          key: notes
