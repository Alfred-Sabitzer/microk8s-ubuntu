apiVersion: external-secrets.io/v1beta1
kind: ExternalSecretmetadata
metadata:
  name: external-another-secret
  namespace: eso-test
  labels:
    app.kubernetes.io/managed-by: keepass-to-eso-openbao-py
  annotations:
    keepassxc.folderPath: root-eso-test
    keepassxc.database: 
      home-alfred-github-microk8s-ubuntu-applications-eso-test-eso-kd
  refreshInterval: 10m
spec:
  secretStoreRef:
    name: eso-test-eso
    kind: SecretStore
  target:
    name: external-another-secret
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        secretKey: eso-test/external-another-secret
        key: username
    - secretKey: password
      remoteRef:
        secretKey: eso-test/external-another-secret
        key: password
    - secretKey: url
      remoteRef:
        secretKey: eso-test/external-another-secret
        key: url
    - secretKey: notes
      remoteRef:
        secretKey: eso-test/external-another-secret
        key: notes
