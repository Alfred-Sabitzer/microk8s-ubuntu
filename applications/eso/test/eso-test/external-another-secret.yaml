apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: external-another-secret
  namespace: eso-test
  labels:
    app.kubernetes.io/managed-by: keepass-to-eso-openbao-py
  annotations:
    keepassxc.folderPath: root-eso-test
    keepassxc.database: 
      home-alfred-github-microk8s-ubuntu-applications-eso-test-eso-kd
spec:
  secretStoreRef:
    name: eso-test-eso
    kind: SecretStore
  refreshInterval: 10m
  refreshPolicy: Periodic
  target:
    name: external-another-secret
    creationPolicy: Owner
    deletionPolicy: Delete
    template:
      type: Opaque
      metadata:
        annotations:
          managed-by: keepass-to-eso-openbao-py
        labels:
          managed-by: keepass-to-eso-openbao-py
  data:
    - secretKey: username
      remoteRef:
        key: eso-test/external-another-secret
        property: username
        decodingStrategy: None
    - secretKey: password
      remoteRef:
        key: eso-test/external-another-secret
        property: password
        decodingStrategy: None
    - secretKey: url
      remoteRef:
        key: eso-test/external-another-secret
        property: url
        decodingStrategy: None
    - secretKey: notes
      remoteRef:
        key: eso-test/external-another-secret
        property: notes
        decodingStrategy: None
