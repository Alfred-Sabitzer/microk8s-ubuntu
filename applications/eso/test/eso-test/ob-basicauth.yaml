apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: ob-basicauth
  namespace: eso-test
  labels:
    app.kubernetes.io/managed-by: keepass-to-eso-openbao-py
  annotations:
    keepassxc.folderPath: root-eso-test
    keepassxc.database: 
      home-alfred-github-microk8s-ubuntu-applications-eso-test-eso-kd
    openbao.mount: kv
    openbao.key: eso-test-ob-basicauth
spec:
  provider: openbao
  parameters:
    openbaoAddress: http://openbao.openbao.svc:8200
    openbaoKVVersion: '2'
    roleName: eso-test-role
    objects: |2-
        - objectName: username
          secretPath: secret/data/eso-test/ob-basicauth
          secretKey: username
        - objectName: password
          secretPath: secret/data/eso-test/ob-basicauth
          secretKey: password
