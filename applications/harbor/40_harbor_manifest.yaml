apiVersion: v1
kind: ServiceAccount
metadata:
  name: harbor-sa
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/managed-by: keepass-to-eso-openbao-py
  annotations:
    openbao.mount: harbor
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: harbor-writer
  namespace: ${NAMESPACE}
  labels:
    security: cis
    app.kubernetes.io/managed-by: keepass-to-eso-openbao-py
  annotations:
    openbao.mount: harbor
rules:
  - apiGroups:
      - ''
    resources:
      - pods
    verbs:
      - get
  - apiGroups:
      - secrets-store.csi.x-k8s.io
    resources:
      - secretproviderclasses
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - secrets-store.csi.x-k8s.io
    resources:
      - secretproviderclasspodstatuses
    verbs:
      - create
      - get
      - update
      - patch
  - apiGroups:
      - ''
    resources:
      - events
    verbs:
      - create
      - patch
  - apiGroups:
      - ''
    resources:
      - secrets
    verbs:
      - create
      - update
      - patch
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: harbor-swb
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/managed-by: keepass-to-eso-openbao-py
  annotations:
    openbao.mount: harbor
roleRef:
  kind: Role
  name: harbor-writer
  apiGroup: rbac.authorization.k8s.io
subjects:
  - kind: ServiceAccount
    name: harbor-sa
    namespace: ${NAMESPACE}
