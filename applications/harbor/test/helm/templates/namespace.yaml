apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.namespace }}
  labels:
    app: {{ .Release.Name }}
    istio.io/dataplane-mode: none
    istio-injection: disabled
    kubernetes.io/metadata.name: {{ .Values.namespace }}
    monitoring: enabled
    pod-security.kubernetes.io/enforce: restricted
spec:
  finalizers:
    - kubernetes