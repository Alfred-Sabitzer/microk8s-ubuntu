---
# https://headlamp.dev/docs/latest/installation/
# Creates a cluster-admin ServiceAccount and ClusterRoleBinding for Headlamp login.
# WARNING: This grants full cluster-admin rights. Use only for testing or trusted environments.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: headlamp-admin
  namespace: ${NAMESPACE}
  labels:
    role: cluster-admin
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: headlamp-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: headlamp-admin
    namespace: ${NAMESPACE}
---
# To get a long-lived bearer token for this service account, use:
# kubectl create token -n ${NAMESPACE} headlamp-admin
#
# A Secret-based token is not required for modern Kubernetes versions.
