---
# Access Headlamp via the Istio ingress gateway with mutual TLS.
# The hostname is templated from HEADLAMP_HOST and defaults to headlamp.${K8S_ENVIRONMENT}.slainte.at.
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: headlamp-mutual
  namespace: ${NAMESPACE}
spec:
  hosts:
    - "${HEADLAMP_HOST}"
  gateways:
    - istio-gateways/slainte-at
  http:
    - match:
        - uri:
            prefix: /
      route:
        - destination:
            host: headlamp.${NAMESPACE}.svc.cluster.local
            port:
              number: 80
---
