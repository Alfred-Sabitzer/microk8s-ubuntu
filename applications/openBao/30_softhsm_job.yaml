apiVersion: batch/v1
kind: Job
metadata:
  name: softhsm-job
  namespace: ${NAMESPACE}
spec:
  template:
    spec:
      containers:
      - name: softhsm
        image: alpine:latest
        volumeMounts:
          - name: softhsm-data
            mountPath: /var/lib/softhsm
        env:
          - name: SOFTHSM2_CONF
            value: "/etc/softhsm2.conf"
        command:
          - "sh"
          - "-c"
          - |
            apk update && apk upgrade && \
            apk add --update tzdata && \
            cp /usr/share/zoneinfo/Europe/Vienna /etc/localtime && \
            echo "Europe/Vienna" > /etc/timezone && \
            apk add --no-cache softhsm && \
            softhsm2-util --init-token --free --label "OpenbaoToken" --pin ${K8S_OPENBAO_USER_PIN} --so-pin ${K8S_OPENBAO_SO_PIN} && \
            cp /usr/lib/softhsm/libsofthsm2.so /var/lib/softhsm/libsofthsm2.so && \
            sleep 10
      volumes:
      - name: softhsm-data
        persistentVolumeClaim:
          claimName: softhsm-pvc
      restartPolicy: Never
  backoffLimit: 4
