---
# https://cert-manager.io/docs/usage/certificate/
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: openbao-tls
  namespace: ${NAMESPACE}
spec:
  isCA: false
  # Avoid using commonName for DNS names in end-entity (leaf) certificates. Unless you have a specific
  # need for it in your environment, use dnsNames exclusively to avoid issues with commonName.
  # Usually, commonName is used to give human-readable names to CA certificates and can be avoided for
  # other certificates.
  secretName: openbao-tls
  duration: 2160h        # 90 days
  renewBefore: 360h      # 15 days
  privateKey:
    algorithm: RSA
    encoding: PKCS1
    size: 2048
    rotationPolicy: Always
  issuerRef: # Only for internal access
    name: k8s-intermediate-issuer
    kind: ClusterIssuer
    group: cert-manager.io
  dnsNames:
  - "openbao-0.openbao-internal"
  emailAddresses:
    - slainte@slainte.at
  # Needs cert-manager 1.14+ and "OtherNames" feature flag
  subject:
    countries:
      - "AT"
    provinces:
      - "Vienna"
    organizations:
      - "Slainte Organization"
    organizationalUnits:
      - "openbao-0.openbao-internal"
  usages:
    - digital signature
    - key encipherment
    - server auth
---