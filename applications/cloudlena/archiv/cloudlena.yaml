apiVersion: apps/v1
kind: Deployment
metadata:
  name: s3-browser
  namespace: rook-ceph
spec:
  replicas: 1
  selector:
    matchLabels:
      app: s3-browser
  template:
    metadata:
      labels:
        app: s3-browser
    spec:
      containers:
      - name: s3manager
        image: cloudlena/s3manager:latest
        ports:
        - containerPort: 8080
        env:
        - name: AWS_ACCESS_KEY_ID
          value: "YOUR_CEPH_ACCESS_KEY"
        - name: AWS_SECRET_ACCESS_KEY
          value: "YOUR_CEPH_SECRET_KEY"
        - name: AWS_ENDPOINT
          value: "http://rook-ceph.svc"
        - name: AWS_REGION
          value: "us-east-1" # Rook-Ceph usually ignores this, but it must be set
        - name: FORCE_PATH_STYLE
          value: "true" # Required for Ceph RGW
---
apiVersion: v1
kind: Service
metadata:
  name: s3-browser-service
  namespace: rook-ceph
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8080
  selector:
    app: s3-browser