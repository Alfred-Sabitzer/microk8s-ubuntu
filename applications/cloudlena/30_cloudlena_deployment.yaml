---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: s3-browser
  namespace: cloudlena
spec:
  replicas: 1
  selector:
    matchLabels:
      app: s3-browser
  template:
    metadata:
      labels:
        app: s3-browser
    spec:
      # Auf default gesetzt, da Token-Automount ohnehin deaktiviert ist
      serviceAccountName: default
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30 
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: s3manager
          image: cloudlena/s3manager:v0.7.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          # Ressourcen-Limits verhindern Speicher- und CPU-Erschöpfung des Nodes
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          env:
            - name: ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: cloudlena
                  key: AccessKey
            - name: SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: cloudlena
                  key: SecretKey
            - name: ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: cloudlena
                  key: Endpoint
            - name: AWS_REGION
              value: "default"
            - name: FORCE_PATH_STYLE
              value: "true"
            - name: USE_SSL
              value: "false"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          # Ermöglicht der App das Schreiben in /tmp, obwohl das Root-FS read-only ist
          volumeMounts:
            - mountPath: /tmp
              name: tmp-volume
      volumes:
        - name: tmp-volume
          emptyDir: {}
      restartPolicy: Always
      dnsPolicy: ClusterFirst
---