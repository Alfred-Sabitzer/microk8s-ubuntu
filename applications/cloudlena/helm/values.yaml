image:
  registry: harbor.test.slainte.at
  project: cloudlena
  repository: cloudlena
  tag: "20261121"
  digest: ""
  pullPolicy: IfNotPresent
  pullSecrets:
    - harbor-pull

buildInfo:
  tool: podman
  deployUnsecure: false

nameOverride: ""
fullnameOverride: ""

deployment:
  enabled: true
  restartPolicy: Always

cronJob:
  enabled: true
  restartPolicy: OnFailure
  schedule: "0 2 * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 1800
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3

job:
  backoffLimit: 3
  activeDeadlineSeconds: 21600
  ttlSecondsAfterFinished: 604800

backup:
  bucket: test-velero
  namespace: velero
  pvcStorage: 1Gi
  retention: 1M

credentials:
  backupSecretProviderClass: cloudlena-backup-credentials
  sshSecretProviderClass: cloudlena-ssh
  backupMountPath: /mnt/cloudlena-backup-credentials
  sshMountPath: /mnt/cloudlena-ssh

mounts:
  source: /mnt/source
  temporary: /tmp

cachePvc:
  storageClassName: ceph-rbd
  size: 10Gi

serviceAccount:
  name: cloudlena-sa
  automountServiceAccountToken: false

replicaCount: 1

networkPolicy:
  enabled: true
  sshCidrs:
    - 192.168.0.10/32
  sshPort: 22

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  privileged: false
  capabilities:
    drop:
      - ALL

hostNetwork: false
hostPID: false
hostIPC: false

resources:
  limits:
    cpu: "1000m"
    memory: "1024Mi"
  requests:
    cpu: "100m"
    memory: "128Mi"

hpa:
  resource-cpu:
    name: cpu
    target:
      type: Utilization
      averageUtilization: 75 # Skaliert hoch, wenn die CPU im Schnitt über 75% steigt
  resource-memory:
    name: memory
    target:
      type: AverageValue
      averageValue: 20Mi     

nodeSelector: {}
tolerations: []
affinity: {}
