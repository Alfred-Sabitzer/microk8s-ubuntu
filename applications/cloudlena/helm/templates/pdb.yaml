---
# 2. POD DISRUPTION BUDGET (PDB)
# Garantiert, dass bei Wartungsarbeiten (z.B. MicroK8s Node-Updates) immer genug Pods online sind
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "cloudlena.fullname" . }}
  namespace: {{ .Release.Namespace }}
  annotations:
    {{- include "cloudlena.annotations" . | nindent 4 }}
  labels:
    {{- include "cloudlena.labels" . | nindent 4 }}
spec:
  # minAvailable schützt die App. Wichtig: Funktioniert nur, wenn minReplicas im HPA >= 2 ist!
  minAvailable: 1
  selector:
    matchLabels:
      {{- include "cloudlena.Selectorlabels" . | nindent 6 }}
---