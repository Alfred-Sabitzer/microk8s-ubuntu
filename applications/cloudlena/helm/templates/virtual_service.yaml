---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: {{ include "cloudlena.fullname" . }}
  namespace: {{ .Release.Namespace }}
  annotations:
    {{- include "cloudlena.annotations" . | nindent 4 }}
  labels:
    {{- include "cloudlena.labels" . | nindent 4 }}
spec:
  hosts:
    - "cloudlena.test.slainte.at"
  gateways:
    - istio-gateways/slainte-at
  http:
    - match:
        - uri:
            prefix: /
      route:
        - destination:
            host: {{ include "cloudlena.fullname" . }}.{{ .Release.Namespace }}.svc.cluster.local
            port:
              number: 8080
---
