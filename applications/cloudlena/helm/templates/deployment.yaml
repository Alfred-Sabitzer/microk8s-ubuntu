{{- if .Values.deployment.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cloudlena.fullname" . }}
  namespace: {{ .Release.Namespace }}
  annotations:
    {{- include "cloudlena.annotations" . | nindent 4 }}
  labels:
    {{- include "cloudlena.labels" . | nindent 4 }}
spec:
  {{- if not .Values.hpa.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      {{- include "cloudlena.Selectorlabels" . | nindent 4 }}
  template:
    metadata:
      annotations:
        {{- include "cloudlena.annotations" . | nindent 8 }}
      labels:
        {{- include "cloudlena.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      terminationGracePeriodSeconds: 30
      hostNetwork: {{ .Values.hostNetwork }}
      hostPID: {{ .Values.hostPID }}
      hostIPC: {{ .Values.hostIPC }}
      restartPolicy: {{ .Values.deployment.restartPolicy }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- range . }}
        - name: {{ . | quote }}
        {{- end }}
      {{- end }}
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      affinity:
        {{- toYaml .Values.affinity | nindent 8 }}
      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}
      containers:
        - name: cloudlena
          {{- if .Values.image.digest }}
          image: {{ printf "%s/%s/%s@%s" .Values.image.registry .Values.image.project .Values.image.repository .Values.image.digest | quote }}
          {{- else }}
          image: {{ printf "%s/%s/%s:%s" .Values.image.registry .Values.image.project .Values.image.repository .Values.image.tag | quote }}
          {{- end }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          env:
            - name: ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: cloudlena
                  key: AWS_ACCESS_KEY_ID
            - name: SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: cloudlena
                  key: AWS_SECRET_ACCESS_KEY
            - name: ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: cloudlena
                  key: AWS_ENDPOINT
            - name: AWS_REGION
              value: "default"
            - name: FORCE_PATH_STYLE
              value: "true"
            - name: USE_SSL
              value: "false"
          volumeMounts:
            - name: tmp-volume
              mountPath: {{ .Values.mounts.temporary }}
            - name: home-volume
              mountPath: /home/cloudlena
      volumes:
        - name: tmp-volume
          emptyDir:
            medium: Memory
            sizeLimit: 32Mi
        - name: home-volume
          emptyDir:
            medium: Memory
            sizeLimit: 32Mi
---
{{- end }}