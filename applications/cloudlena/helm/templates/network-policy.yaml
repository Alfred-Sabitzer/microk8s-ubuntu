{{- if .Values.networkPolicy.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-deny-all
  namespace: {{ .Release.Namespace }}
  annotations:
    {{- include "cloudlena.annotations" . | nindent 4 }}
  labels:
    {{- include "cloudlena.labels" . | nindent 4 }}

spec:
  podSelector:
    matchLabels:
      {{- include "cloudlena.Selectorlabels" . | nindent 6 }}

  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-allow-dns
  namespace: {{ .Release.Namespace }}
  annotations:
    {{- include "cloudlena.annotations" . | nindent 4 }}
  labels:
    {{- include "cloudlena.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "cloudlena.Selectorlabels" . | nindent 6 }}

  policyTypes:
    - Egress

  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "cloudlena.fullname" . }}-allow-istio-ingress
  namespace: {{ .Release.Namespace }}
  annotations:
    {{- include "cloudlena.annotations" . | nindent 4 }}
  labels:
    {{- include "cloudlena.labels" . | nindent 4 }}

spec:
  podSelector:
    matchLabels:
      {{- include "cloudlena.Selectorlabels" . | nindent 6 }}

  policyTypes:
    - Ingress

  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: istio-gateways
          podSelector:
            matchLabels:
              istio: ingressgateway
      ports:
        - protocol: TCP
          port: 8080
---
{{- end }}
