---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: s3-browser
  namespace: cloudlena
spec:
  replicas: 1
  selector:
    matchLabels:
      app: s3-browser
  template:
    metadata:
      labels:
        app: s3-browser
    spec:
      serviceAccountName: cloudlena-sa
      # Prevents containers from accessing the underlying node's credentials
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 0

      securityContext:
        # Runs the entire pod as a non-root user
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        # Restricts pod communication using a strict seccomp profile
        seccompProfile:
          type: RuntimeDefault

      containers:
      - name: s3manager
        image: cloudlena/s3manager:v0.7.0
        ports:
        - containerPort: 8080
        env:
        - name: ACCESS_KEY_ID
          value: "5f480f0958ca557a4ba5" # Replace with your actual Ceph access key
        - name: SECRET_ACCESS_KEY
          value: "OsqiTKY+dJ9xjEQRinPEU9QY+W8Zz5OfwBRSrurOoTQ=" # Replace with your actual Ceph secret key
        - name: ENDPOINT
          value: "192.168.0.194:8081" # Replace with your actual Ceph RGW endpoint
        - name: AWS_REGION
          value: "default" # Rook-Ceph usually ignores this, but it must be set
        - name: FORCE_PATH_STYLE
          value: "true" # Required for Ceph RGW
        - name: USE_SSL
          value: "false" # Required for Ceph RGW

        volumeMounts:
          - name: cloudlena
            readOnly: true
            mountPath: "/mnt/cloudlena"

        securityContext:
          # Prevents the container process from gaining more privileges than its parent
          allowPrivilegeEscalation: false
          # Makes the root filesystem read-only to prevent unauthorized file modifications
          readOnlyRootFilesystem: true
          # Drops all default Linux capabilities to minimize the attack surface
          capabilities:
            drop:
            - ALL

      restartPolicy: Always
      dnsPolicy: ClusterFirst

      volumes:
        # Mount the secret via the CSI driver
        - name: openbao
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: cloudlena
        # Mount the same secret directly from Kubernetes for comparison
        - name: cloudlena
          secret:
            secretName: cloudlena
---