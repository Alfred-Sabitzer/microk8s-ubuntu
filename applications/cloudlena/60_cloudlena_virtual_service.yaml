---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: s3-browser-mutual
  namespace: cloudlena
spec:
  hosts:
    - "cloudlena.test.slainte.at"
  gateways:
    - istio-gateways/slainte-at
  http:
    - match:
        - uri:
            prefix: /
      route:
        - destination:
            host: s3-browser-service.cloudlena.svc.cluster.local
            port:
              number: 8080
---
