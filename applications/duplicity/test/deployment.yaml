---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: duplicity
  namespace: duplicity
  labels:
    app: duplicity
spec:
  selector:
    matchLabels:
      app: duplicity
  replicas: 1
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: duplicity
    spec:
      serviceAccountName: duplicity-sa
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: 0
      containers:
        - name: test
          # This deployment is for duplicity testing purposes to ensure that the secrets are mounted correctly.
          image:  harbor.test.slainte.at/duplicity/test@sha256:48d81f512db6c2e251b4b1c7aab91b84051e2593d5695ef78ca7c64394217cc1
          command: ["sh", "-c", "while true; do date; ls -R /mnt/ ; sleep 5; done"] # List mounted files every 5 seconds for verification
          volumeMounts:
            - name: duplicity-backup-credentials
              mountPath: "/mnt/duplicity-backup-credentials"
              readOnly: true
      volumes:
        # Mount the secret via the CSI driver
        - name: duplicity-backup-credentials
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: duplicity-backup-credentials
---            