---
apiVersion: v1
kind: Namespace
metadata:
  name: duplicity
  labels:
    name: duplicity
    kubernetes.io/metadata.name: duplicity
    istio.io/dataplane-mode: none
    istio-injection: disabled
    monitoring: enabled
    # Namespaces can be labeled to enforce the Pod Security Standards. 
    # The three policies privileged, baseline and restricted broadly cover the security spectrum and are implemented by the Pod Security admission controller
    pod-security.kubernetes.io/enforce: baseline
  annotations:
    image-repository: harbor.test.slainte.at/duplicity
  finalizers:
    - kubernetes
---
