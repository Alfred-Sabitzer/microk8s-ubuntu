---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: duplicity-test
  namespace: duplicity
  labels:
    app: duplicity-test
spec:
  replicas: 1

  selector:
    matchLabels:
      app: duplicity-test

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: duplicity-test

    spec:
      serviceAccountName: duplicity-sa

      # Keine Kubernetes-API-Credentials automatisch mounten
      automountServiceAccountToken: false

      terminationGracePeriodSeconds: 30

      hostNetwork: false
      hostPID: false
      hostIPC: false

      imagePullSecrets:
        - name: harbor-pull

      # Pod-Level Security
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000

        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch

        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: duplicity-test
          image: harbor.test.slainte.at/duplicity/test@sha256:144f3d1cf74e1293b7d428beb3a49cafdd726d6992abd40e682ef19f7dfd6e5a

          imagePullPolicy: IfNotPresent

          command:
            - sh
            - -c
            - |
              while true; do
                date
                ls -la /mnt/
                sleep 5
              done

          # Container-Level Security
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true

            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000

            capabilities:
              drop:
                - ALL          

          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true

          resources:
            requests:
              cpu: 10m
              memory: 32Mi
              ephemeral-storage: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
              ephemeral-storage: 256Mi

          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp

            - name: duplicity-backup-credentials
              mountPath: /mnt/duplicity-backup-credentials
              readOnly: true

            - name: duplicity-ssh
              mountPath: /mnt/duplicity-ssh
              readOnly: true

            - name: duplicity-pvc
              mountPath: /mnt/duplicity-pvc

            - name: home-volume
              mountPath: /home/duplicity

            - name: backup-storage
              mountPath: /mnt/source
              readOnly: true

      volumes:
        - name: tmp-volume
          emptyDir:
            medium: Memory
            sizeLimit: 32Mi

        - name: duplicity-backup-credentials
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: duplicity-backup-credentials
              filePermission: "0400"

        - name: duplicity-ssh
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: duplicity-ssh
              filePermission: "0400"

        - name: duplicity-pvc
          persistentVolumeClaim:
            claimName: duplicity-pvc

        - name: home-volume
          emptyDir:
            medium: Memory
            sizeLimit: 32Mi

        - name: backup-storage
          persistentVolumeClaim:
            claimName: ${DUPLICITY_BUCKET_NAME}
---