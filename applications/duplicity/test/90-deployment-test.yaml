---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: duplicity-test
  namespace: duplicity
  labels:
    app: duplicity-test
spec:
  replicas: 1

  selector:
    matchLabels:
      app: duplicity-test

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1

  template:
    metadata:
      labels:
        app: duplicity-test

    spec:
      serviceAccountName: duplicity-sa

      # Keine Kubernetes-API-Credentials automatisch mounten
      automountServiceAccountToken: true

      terminationGracePeriodSeconds: 30

      imagePullSecrets:
        - name: harbor-pull

      # Pod-Level Security
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: duplicity-test
          image: harbor.test.slainte.at/duplicity/test@sha256:457e01b7d9ed152e1a126c69ed6a658e1c3fbad5cb9d00e7e545a40e3103dc53

          imagePullPolicy: IfNotPresent

          command:
            - sh
            - -c
            - |
              while true; do
                date
                ls -la /mnt/
                sleep 5
              done

          # Container-Level Security
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true

            capabilities:
              drop:
                - ALL
              add:
                - CHOWN

          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi

          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp

            - name: duplicity-backup-credentials
              mountPath: /mnt/duplicity-backup-credentials
              readOnly: true

            - name: duplicity-ssh
              mountPath: /mnt/duplicity-ssh
              readOnly: true

            - name: duplicity-pvc
              mountPath: /mnt/duplicity-pvc

            - name: home-volume
              mountPath: /home/duplicity

            - name: backup-storage
              mountPath: /mnt/source

      volumes:
        - name: tmp-volume
          emptyDir:
            medium: Memory
            sizeLimit: 32Mi

        - name: duplicity-backup-credentials
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: duplicity-backup-credentials
              filePermission: "0400"

        - name: duplicity-ssh
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: duplicity-ssh
              filePermission: "0400"

        - name: duplicity-pvc
          persistentVolumeClaim:
            claimName: duplicity-pvc

        - name: home-volume
          emptyDir:
            medium: Memory
            sizeLimit: 128Mi

        - name: backup-storage
          persistentVolumeClaim:
            claimName: ${DUPLICITY_BUCKET_NAME}
---