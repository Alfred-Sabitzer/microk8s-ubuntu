apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: duplicity-backup-credentials
  namespace: duplicity
  labels:
    app.kubernetes.io/managed-by: keepass-to-eso-openbao-py
  annotations:
    keepassxc.folderPath: root-duplicity
    keepassxc.database: home-alfred-kdbx-kdbx-k8stest-kdbx
    openbao.mount: kv
    openbao.key: duplicity-duplicity-backup-credentials
spec:
  provider: openbao
  parameters:
    openbaoAddress: http://openbao.openbao.svc:8200
    openbaoKVVersion: '2'
    roleName: duplicity-role
    objects: |2-
        - objectName: username
          secretPath: secret/data/duplicity/duplicity-backup-credentials
          secretKey: username
        - objectName: password
          secretPath: secret/data/duplicity/duplicity-backup-credentials
          secretKey: password
        - objectName: url
          secretPath: secret/data/duplicity/duplicity-backup-credentials
          secretKey: url
        - objectName: notes
          secretPath: secret/data/duplicity/duplicity-backup-credentials
          secretKey: notes
        - objectName: gpg.private_key.asc
          secretPath: secret/data/duplicity/duplicity-backup-credentials
          secretKey: gpg.private_key.asc
        - objectName: gpg.public.asc
          secretPath: secret/data/duplicity/duplicity-backup-credentials
          secretKey: gpg.public.asc