---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: duplicity
  namespace: duplicity
  labels:
    app: duplicity
spec:
  replicas: 1

  selector:
    matchLabels:
      app: duplicity

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1

  template:
    metadata:
      labels:
        app: duplicity

    spec:
      serviceAccountName: duplicity-sa

      # Keine Kubernetes-API-Credentials automatisch mounten
      automountServiceAccountToken: false

      terminationGracePeriodSeconds: 30

      imagePullSecrets:
        - name: harbor-pull

      # Pod-Level Security
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: duplicity
          image: harbor.test.slainte.at/duplicity/test@sha256:a7c83362f1026effe6a0cf94c2aea43ab5b6abb89da9e538f57becc19092c3eb

          imagePullPolicy: IfNotPresent

          command:
            - sh
            - -c
            - |
              while true; do
                date
                ls -la /mnt/
                sleep 5
              done

          # Container-Level Security
          labels:
            app: duplicity
        spec:
          # Zwingend erforderlich für CronJobs (statt 'Always')
          restartPolicy: OnFailure

          serviceAccountName: velero-sa
          automountServiceAccountToken: false
          terminationGracePeriodSeconds: 30

          hostNetwork: false
          hostPID: false
          hostIPC: false

          imagePullSecrets:
            - name: harbor-pull

          # Pod-Level Security
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault

          containers:
            - name: duplicity
              image: harbor.test.slainte.at/velero/duplicity@sha256:137aabc07f6d9656788b718f7c224b119387350e1f2adb69d7189060610e919d
              imagePullPolicy: IfNotPresent

              # Wichtig: Ohne 'while true', damit sich der Pod nach Ausführung beendet!
              command:
                - sh
                - -c
                - |
                  date
                  ls -la /mnt/
                  /usr/local/bin/backup.sh

              # Container-Level Security
              securityContext:
                allowPrivilegeEscalation: false
                privileged: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 1000
                runAsGroup: 1000
                capabilities:
                  drop:
                    - ALL

              resources:
                requests:
                  cpu: 250m
                  memory: 512Mi
                  ephemeral-storage: 2Gi
                limits:
                  cpu: "1"
                  memory: 2Gi
                  ephemeral-storage: 4Gi

              volumeMounts:
                - name: tmp-volume
                  mountPath: /tmp

                - name: duplicity-backup-credentials
                  mountPath: /mnt/duplicity-backup-credentials
                  readOnly: true

                - name: duplicity-ssh
                  mountPath: /mnt/duplicity-ssh
                  readOnly: true

                - name: duplicity-pvc
                  mountPath: /mnt/duplicity-pvc

                - name: home-volume
                  mountPath: /home/duplicity

                - name: backup-storage
                  mountPath: /mnt/source
                  readOnly: true

          volumes:
            - name: tmp-volume
              emptyDir:
                medium: Memory
                sizeLimit: 32Mi

            - name: duplicity-backup-credentials
              csi:
                driver: secrets-store.csi.k8s.io
                readOnly: true
                volumeAttributes:
                  secretProviderClass: duplicity-backup-credentials
                  filePermission: "0400"

            - name: duplicity-ssh
              csi:
                driver: secrets-store.csi.k8s.io
                readOnly: true
                volumeAttributes:
                  secretProviderClass: duplicity-ssh
                  filePermission: "0400"

            - name: duplicity-pvc
              persistentVolumeClaim:
                claimName: duplicity-pvc

            - name: home-volume
              emptyDir:
                medium: Memory
                sizeLimit: 32Mi

            - name: backup-storage
              persistentVolumeClaim:
                claimName: ${DUPLICITY_BUCKET_NAME}
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true

            capabilities:
              drop:
                - ALL

          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi

          volumeMounts:
            - name: duplicity-backup-credentials
              mountPath: /mnt/duplicity-backup-credentials
              readOnly: true

            - name: duplicity-ssh
              mountPath: /home/duplicity/.ssh
              readOnly: true

            - name: tmp-volume
              mountPath: /tmp

      volumes:
        - name: tmp-volume
          emptyDir:
            medium: Memory
            sizeLimit: 32Mi

        - name: duplicity-backup-credentials
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: duplicity-backup-credentials
              filePermission: "0600"

        - name: duplicity-ssh
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: duplicity-ssh
              filePermission: "0600"
---