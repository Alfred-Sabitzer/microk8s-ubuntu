image:
  registry: "harbor.test.slainte.at"
  project: "test"
  repository: "dummy"
  tag: "20260901"
  digest: "sha256:63c49e1cdae675cf9f93bd95db9625938e49811aec1e28f4b268dd3ab72bc1af"
  pullPolicy: IfNotPresent
  pullSecrets: "harbor-pull"

buildInfo:
  tool: "podman"
  deploy_unsecure: false

duplicity:
  labels: true
  annotations: true

cronJob:
  schedule: "0 2 * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 1800
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3

job:
  backoffLimit: 1
  activeDeadlineSeconds: 21600replicaCount
  ttlSecondsAfterFinished: 604800

backup:
  bucket: test-velero
  s3Endpoint: http://192.168.0.194:8081
  s3Region: default
  fullIfOlderThan: 1W
  retention: 2W

credentials:
  secretName: duplicity-backup-credentials
  keys:
    s3AccessKey: s3-access-key
    s3SecretKey: s3-secret-key
    gpgPassphrase: gpg-passphrase
    sshHost: ssh-host
    sshUser: ssh-user
    sshRemotePath: ssh-remote-path
    sshPort: ssh-port
  sshSecretName: duplicity-ssh
  sshKeyFile: id_ed25519
  knownHostsFile: known_hosts

mounts:
  source: /mnt/source
  destination: /mnt/remote
  backupPath: /mnt/remote/duplicity/test-velero
  archiveDir: /tmp/duplicity-cache

fuse:
  devicePath: /dev/fuse

# 3. Sicherheitskontext auf Container-Ebene (Härtung der Runtime)
securityContext:
  runAsNonRoot: false
  runAsUser: 0
  runAsGroup: 0
  seccompProfile:
    type: RuntimeDefault

#  fsGroup: 10001
#  allowPrivilegeEscalation: true
#  readOnlyRootFilesystem: false
#  privileged: true
  # capabilities:
  #   drop:
  #     - ALL

# 1. Host-Isolierung erzwingen
hostNetwork: false
hostPID: false
hostIPC: false

# 4. Ressourcen-Limits definieren (Schutz vor DoS/OOM-Attacken)
resources:
  limits:
    cpu: "500m"
    memory: "512Mi"
  requests:
    cpu: "100m"
    memory: "128Mi"

replicaCount: 1
restartPolicy: Always
nodeSelector: {}
tolerations: []
affinity: {}
