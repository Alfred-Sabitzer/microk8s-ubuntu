image:
  registry: harbor.test.slainte.at
  project: duplicity
  repository: duplicity
  tag: "20261121"
  digest: ""
  pullPolicy: IfNotPresent
  pullSecrets:
    - harbor-pull

buildInfo:
  tool: podman
  deployUnsecure: false

nameOverride: ""
fullnameOverride: ""

cronJob:
  schedule: "0 2 * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 1800
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3

job:
  backoffLimit: 1
  activeDeadlineSeconds: 21600
  ttlSecondsAfterFinished: 604800

backup:
  bucket: test-velero
  pvcStorage: 1Gi

credentials:
  backupSecretProviderClass: duplicity-backup-credentials
  sshSecretProviderClass: duplicity-ssh
  backupMountPath: /mnt/duplicity-backup-credentials
  sshMountPath: /mnt/duplicity-ssh

mounts:
  source: /mnt/source
  temporary: /tmp

cachePvc:
  storageClassName: ceph-rbd
  size: 10Gi

serviceAccount:
  name: duplicity-sa
  automountServiceAccountToken: false

replicaCount: 1
restartPolicy: Always

networkPolicy:
  enabled: true
  sshCidrs:
    - 192.168.0.10/32
  sshPort: 22

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  privileged: false
  capabilities:
    drop:
      - ALL

hostNetwork: false
hostPID: false
hostIPC: false

resources:
  limits:
    cpu: "500m"
    memory: "512Mi"
  requests:
    cpu: "100m"
    memory: "128Mi"

nodeSelector: {}
tolerations: []
affinity: {}
