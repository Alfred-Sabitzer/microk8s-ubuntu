apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Release.Name }}-harbor-cosign
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  annotations:
    {{- include "duplicity.annotations" . | nindent 4 }}
  labels:
    {{- include "duplicity.labels" . | nindent 4 }}
spec:
  secretStoreRef:
    name: {{ .Release.Name }}-eso
    kind: SecretStore
  refreshInterval: 24h
  refreshPolicy: Periodic
  target:
    name: {{ .Release.Name }}-harbor-cosign
    creationPolicy: Owner
    deletionPolicy: Delete
    template:
      type: Opaque
      metadata:
        annotations:
          managed-by: keepass-to-eso-openbao-py
        labels:
          managed-by: keepass-to-eso-openbao-py
  data:
    - secretKey: username
      remoteRef:
        key: duplicity/harbor-cosign
        property: username
        decodingStrategy: None
    - secretKey: password
      remoteRef:
        key: duplicity/harbor-cosign
        property: password
        decodingStrategy: None
    - secretKey: url
      remoteRef:
        key: duplicity/harbor-cosign
        property: url
        decodingStrategy: None
    - secretKey: notes
      remoteRef:
        key: duplicity/harbor-cosign
        property: notes
        decodingStrategy: None
    - secretKey: cosign.key
      remoteRef:
        key: duplicity/harbor-cosign
        property: cosign.key
        decodingStrategy: None
    - secretKey: cosign.password
      remoteRef:
        key: duplicity/harbor-cosign
        property: cosign.password
        decodingStrategy: None
    - secretKey: cosign.pub
      remoteRef:
        key: duplicity/harbor-cosign
        property: cosign.pub
        decodingStrategy: None
