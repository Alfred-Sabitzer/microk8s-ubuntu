{{- if .Values.cronJob.enabled }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "duplicity.fullname" . }}
  namespace: {{ .Release.Namespace }}
  annotations:
    {{- include "duplicity.annotations" . | nindent 4 }}
  labels:
    {{- include "duplicity.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.cronJob.schedule | quote }}
  timeZone: {{ .Values.cronJob.timeZone | quote }}
  concurrencyPolicy: {{ .Values.cronJob.concurrencyPolicy }}
  successfulJobsHistoryLimit: {{ .Values.cronJob.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.cronJob.failedJobsHistoryLimit }}
  startingDeadlineSeconds: {{ .Values.cronJob.startingDeadlineSeconds }}
  jobTemplate:
    metadata:
      annotations:
        {{- include "duplicity.annotations" . | nindent 8 }}
      labels:
        {{- include "duplicity.labels" . | nindent 8 }}
    spec:
      activeDeadlineSeconds: {{ .Values.job.activeDeadlineSeconds }}
      backoffLimit: {{ .Values.job.backoffLimit }}
      ttlSecondsAfterFinished: {{ .Values.job.ttlSecondsAfterFinished }}
      template:
        metadata:
          annotations:
            {{- include "duplicity.annotations" . | nindent 12 }}
          labels:
            {{- include "duplicity.labels" . | nindent 12 }}

        spec:
          serviceAccountName: {{ .Values.serviceAccount.name }}
          automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
          terminationGracePeriodSeconds: 30
          hostNetwork: {{ .Values.hostNetwork }}
          hostPID: {{ .Values.hostPID }}
          hostIPC: {{ .Values.hostIPC }}
          restartPolicy: {{ .Values.cronJob.restartPolicy }}
          securityContext:
            {{- toYaml .Values.podSecurityContext | nindent 12 }}
          {{- with .Values.image.pullSecrets }}
          imagePullSecrets:
            {{- range . }}
            - name: {{ . | quote }}
            {{- end }}
          {{- end }}
          nodeSelector:
            {{- toYaml .Values.nodeSelector | nindent 12 }}
          affinity:
            {{- toYaml .Values.affinity | nindent 12 }}
          tolerations:
            {{- toYaml .Values.tolerations | nindent 12 }}
          containers:
            - name: duplicity
              {{- if .Values.image.digest }}
              image: {{ printf "%s/%s/%s@%s" .Values.image.registry .Values.image.project .Values.image.repository .Values.image.digest | quote }}
              {{- else }}
              image: {{ printf "%s/%s/%s:%s" .Values.image.registry .Values.image.project .Values.image.repository .Values.image.tag | quote }}
              {{- end }}
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              command:
                - sh
                - -c
                - /usr/local/bin/backup.sh
              securityContext:
                {{- toYaml .Values.containerSecurityContext | nindent 16 }}
              resources:
                {{- toYaml .Values.resources | nindent 16 }}
              env:
                - name: RETENTION
                  value: {{ .Values.backup.retention | quote }}
              volumeMounts:
                - name: backup-credentials
                  mountPath: {{ .Values.credentials.backupMountPath }}
                  readOnly: true
                - name: ssh-credentials
                  mountPath: {{ .Values.credentials.sshMountPath }}
                  readOnly: true
                - name: tmp-volume
                  mountPath: {{ .Values.mounts.temporary }}
                - name: home-volume
                  mountPath: /home/duplicity
                - name: backup-storage
                  mountPath: {{ .Values.mounts.source }}
                  readOnly: true
                - name: cache
                  mountPath: /mnt/cache
                - name: backup
                  mountPath: "/usr/local/bin"
                  readOnly: true
          volumes:
            - name: tmp-volume
              emptyDir:
                medium: Memory
                sizeLimit: 32Mi
            - name: home-volume
              emptyDir:
                medium: Memory
                sizeLimit: 32Mi
            - name: backup-credentials
              csi:
                driver: secrets-store.csi.k8s.io
                readOnly: true
                volumeAttributes:
                  secretProviderClass: {{ .Values.credentials.backupSecretProviderClass }}
                  filePermission: "0400"
            - name: ssh-credentials
              csi:
                driver: secrets-store.csi.k8s.io
                readOnly: true
                volumeAttributes:
                  secretProviderClass: {{ .Values.credentials.sshSecretProviderClass }}
                  filePermission: "0400"
            - name: backup-storage
              persistentVolumeClaim:
                claimName: {{ .Values.backup.bucket }}
            - name: cache
              persistentVolumeClaim:
                claimName: {{ .Release.Name }}
            - name: backup
              configMap:
                name: {{ include "duplicity.fullname" . }}
                defaultMode: 0555
---
{{- end }}