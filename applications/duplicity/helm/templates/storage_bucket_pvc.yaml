---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ .backup.bucket }}
  annotations:
    {{- include "duplicity.annotations" . | nindent 4 }}
  labels:
    {{- include "duplicity.labels" . | nindent 4 }}

spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain

  # Keine dynamische Provisionierung
  storageClassName: ""

  claimRef:
    namespace: {{ .Release.Namespace }}
    name: {{ .backup.bucket }}

  csi:
    driver: ru.yandex.s3.csi

    # Vorhandenes Secret des Yandex-Treibers
    controllerPublishSecretRef:
      name: {{ .backup.bucket }}
      namespace: {{ .Release.Namespace }}

    nodePublishSecretRef:
      name: {{ .backup.bucket }}
      namespace: {{ .Release.Namespace }}

    nodeStageSecretRef:
      name: {{ .backup.bucket }}
      namespace: {{ .Release.Namespace }}

    volumeAttributes:
      capacity: 1Gi
      mounter: geesefs
      options: "--memory-limit 1000 --dir-mode 0777 --file-mode 0666"

    # Wichtig: Bei Static Provisioning ist der Bucket
    # Bestandteil des VolumeHandles.
    volumeHandle: {{ .backup.bucket }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .backup.bucket }}
  namespace: {{ .Release.Namespace }}
  annotations:
    {{- include "duplicity.annotations" . | nindent 4 }}
  labels:
    {{- include "duplicity.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  resources:
    requests:
      storage: 1Gi
  volumeName: {{ .backup.bucket }}
---