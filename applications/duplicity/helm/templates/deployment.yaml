---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "duplicity.fullname" . }}
  namespace: {{ .Release.Namespace }}
  annotations:
    {{- include "duplicity.annotations" . | nindent 4 }}
  labels:
    {{- include "duplicity.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      annotations:
        {{- include "duplicity.annotations" . | nindent 8 }}
      labels:
        {{- include "duplicity.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      terminationGracePeriodSeconds: 30
      hostNetwork: {{ .Values.hostNetwork }}
      hostPID: {{ .Values.hostPID }}
      hostIPC: {{ .Values.hostIPC }}
      restartPolicy: {{ .Values.restartPolicy }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- range . }}
        - name: {{ . | quote }}
        {{- end }}
      {{- end }}
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      affinity:
        {{- toYaml .Values.affinity | nindent 8 }}
      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}
      containers:
        - name: duplicity
          {{- if .Values.image.digest }}
          image: {{ printf "%s/%s/%s@%s" .Values.image.registry .Values.image.project .Values.image.repository .Values.image.digest | quote }}
          {{- else }}
          image: {{ printf "%s/%s/%s:%s" .Values.image.registry .Values.image.project .Values.image.repository .Values.image.tag | quote }}
          {{- end }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: backup-credentials
              mountPath: {{ .Values.credentials.backupMountPath }}
              readOnly: true
            - name: ssh-credentials
              mountPath: {{ .Values.credentials.sshMountPath }}
              readOnly: true
            - name: tmp-volume
              mountPath: {{ .Values.mounts.temporary }}
            - name: home-volume
              mountPath: /home/duplicity
            - name: backup-storage
              mountPath: {{ .Values.mounts.source }}
              readOnly: true
            - name: {{ .Release.Name }}
              mountPath: /mnt/cache              
            - name: backup
              mountPath: "/usr/local/bin"
              readOnly: true
      volumes:
        - name: tmp-volume
          emptyDir:
            medium: Memory
            sizeLimit: 32Mi
        - name: home-volume
          emptyDir:
            medium: Memory
            sizeLimit: 32Mi
        - name: backup-credentials
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: {{ .Values.credentials.backupSecretProviderClass }}
              filePermission: "0400"
        - name: ssh-credentials
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: {{ .Values.credentials.sshSecretProviderClass }}
              filePermission: "0400"
        - name: backup-storage
          persistentVolumeClaim:
            claimName: {{ .Values.backup.bucket }}
        - name: {{ .Release.Name }}
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}
        - name: backup
          configMap:
            name: {{ include "duplicity.fullname" . }}
            defaultMode: 0555
---