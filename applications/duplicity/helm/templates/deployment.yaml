apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  annotations:
    {{- include "duplicity.annotations" . | nindent 4 }}
  labels:
    {{- include "duplicity.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      annotations:
        {{- include "duplicity.annotations" . | nindent 8 }}
      labels:
        {{- include "duplicity.labels" . | nindent 8 }}

    spec:
      hostNetwork: {{ .Values.hostNetwork }}
      hostPID: {{ .Values.hostPID }}
      hostIPC: {{ .Values.hostIPC }}

      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}

      imagePullSecrets:
        - name: {{ .Values.image.pullSecrets }}

      restartPolicy: {{ .Values.restartPolicy | quote }}
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      imagePullSecrets:
        - name: {{ .Values.image.pullSecrets }}
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      affinity:
        {{- toYaml .Values.affinity | nindent 8 }}
      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}

      containers:
        - image: {{ .Values.image.registry }}/{{ .Values.image.project }}/{{ .Values.image.repository }}@{{ .Values.image.digest }}
          name: {{ .Values.image.repository }}
          imagePullPolicy: {{ .Values.image.pullPolicy | quote }}

          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          env:
            - name: S3_BUCKET
              value: {{ .Values.backup.bucket | quote }}
            - name: S3_ENDPOINT
              value: {{ .Values.backup.s3Endpoint | quote }}
            - name: S3_REGION
              value: {{ .Values.backup.s3Region | quote }}
            - name: DUPLICITY_FULL_IF_OLDER_THAN
              value: {{ .Values.backup.fullIfOlderThan | quote }}
            - name: DUPLICITY_RETENTION
              value: {{ .Values.backup.retention | quote }}
            - name: SOURCE_MOUNT
              value: {{ .Values.mounts.source | quote }}
            - name: DESTINATION_MOUNT
              value: {{ .Values.mounts.destination | quote }}
            - name: DESTINATION_PATH
              value: {{ .Values.mounts.backupPath | quote }}
            - name: DUPLICITY_ARCHIVE_DIR
              value: {{ .Values.mounts.archiveDir | quote }}
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.credentials.secretName }}
                  key: {{ .Values.credentials.keys.s3AccessKey }}
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.credentials.secretName }}
                  key: {{ .Values.credentials.keys.s3SecretKey }}
            - name: GPG_PASSPHRASE
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.credentials.secretName }}
                  key: {{ .Values.credentials.keys.gpgPassphrase }}
            - name: SSH_HOST
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.credentials.secretName }}
                  key: {{ .Values.credentials.keys.sshHost }}
            - name: SSH_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.credentials.secretName }}
                  key: {{ .Values.credentials.keys.sshUser }}
            - name: SSH_REMOTE_PATH
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.credentials.secretName }}
                  key: {{ .Values.credentials.keys.sshRemotePath }}
            - name: SSH_PORT
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.credentials.secretName }}
                  key: {{ $.Values.credentials.keys.sshPort }}
                  optional: true
          volumeMounts:
            # - name: fuse-device
            #   mountPath: {{ .Values.fuse.devicePath }}
            - name: ssh-credentials
              mountPath: /run/ssh
              readOnly: true
            - name: source
              mountPath: {{ .Values.mounts.source }}
            - name: destination
              mountPath: {{ .Values.mounts.destination }}
            - name: duplicity-cache
              mountPath: {{ .Values.mounts.archiveDir }}
      volumes:
        # - name: fuse-device
        #   hostPath:
        #     path: {{ .Values.fuse.devicePath }}
        #     type: CharDevice
        - name: ssh-credentials
          secret:
            secretName: {{ .Values.credentials.sshSecretName }}
            defaultMode: 0400
            items:
              - key: {{ .Values.credentials.sshKeyFile }}
                path: id_ed25519
              - key: {{ .Values.credentials.knownHostsFile }}
                path: known_hosts
        - name: source
          emptyDir: {}
        - name: destination
          emptyDir: {}
        - name: duplicity-cache
          emptyDir: {}