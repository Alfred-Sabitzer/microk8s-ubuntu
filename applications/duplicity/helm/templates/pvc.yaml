---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-pvc
  namespace: {{ .Release.Namespace }}
  annotations:
    {{- include "duplicity.annotations" . | nindent 4 }}
  labels:
    {{- include "duplicity.labels" . | nindent 4 }}  
spec:
  accessModes:
    - ReadWriteMany # S3 erlaubt standardmäßig den Zugriff von vielen Pods gleichzeitig
  storageClassName: csi-s3 # Verweis auf die StorageClass, die den S3-CSI-Treiber verwendet
  resources:
    requests:
      # Da S3 unendlich skaliert, ist die Angabe für Ceph rein symbolisch für K8s
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ .Release.Name }}-pv
  namespace: {{ .Release.Namespace }}
  annotations:
    {{- include "duplicity.annotations" . | nindent 4 }}
  labels:
    {{- include "duplicity.labels" . | nindent 4 }}  
spec:
  capacity:
    storage: 100Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""

  claimRef:
    namespace: test
    name: ceph-s3-existing-pvc

  csi:
    driver: ru.yandex.s3.csi

    volumeHandle: my-existing-bucket

    controllerPublishSecretRef:
      name: rook-ceph-object-user-external-store-csi-s3
      namespace: rook-ceph-external

    nodeStageSecretRef:
      name: rook-ceph-object-user-external-store-csi-s3
      namespace: rook-ceph-external

    nodePublishSecretRef:
      name: rook-ceph-object-user-external-store-csi-s3
      namespace: rook-ceph-external

    volumeAttributes:
      mounter: geesefs
      options: "--memory-limit 1000 --dir-mode 0777 --file-mode 0666"

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-pvc
  namespace: {{ .Release.Namespace }}
  annotations:
    {{- include "duplicity.annotations" . | nindent 4 }}
  labels:
    {{- include "duplicity.labels" . | nindent 4 }}  
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  volumeName: {{ .Release.Name }}-pv
  resources:
    requests:
      storage: 100Gi
---