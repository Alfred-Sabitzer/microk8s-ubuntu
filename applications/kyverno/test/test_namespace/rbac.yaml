kind: Role
metadata:
  name: test-read-harbor-cosign
  namespace: test
rules:
  - apiGroups: [""]
    resources:
      - secrets
    resourceNames:
      - harbor-cosign
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: test-read-harbor-cosign
  namespace: test
subjects:
  - kind: ServiceAccount
    name: kyverno-admission-controller
    namespace: kyverno
roleRef:
