apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    build.image: ugly-no-runtime-default
    build.project: kyverno-test
    build.registry: harbor.test.slainte.at
    build.tag: "20261001"
    build.tool: podman
  labels:
    app: ugly-no-runtime-default
  name: ugly-no-runtime-default
  namespace: kyverno-test
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: ugly-no-runtime-default
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      annotations:
        build.image: ugly-no-runtime-default
        build.project: kyverno-test
        build.registry: harbor.test.slainte.at
        build.tag: "20261001"
        build.tool: podman
      labels:
        app: ugly-no-runtime-default
    spec:
      containers:
      # The image below is signed and should pass the Kyverno policy check for signed images. Change the uid accordingly if you want to test with a different image.
      - image: harbor.test.slainte.at/kyverno-test/dummy@sha256:57565c078cabc055e833f6e03dd11a5d873e8dd800f5b2e10588d54f0b7f16be
        imagePullPolicy: IfNotPresent
        name: ugly-no-runtime-default
        ports:
        - containerPort: 80
          name: http
          protocol: TCP
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          privileged: false
          readOnlyRootFilesystem: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    build.image: ugly-no-volume-mount
    build.project: kyverno-test
    build.registry: harbor.test.slainte.at
    build.tag: "20261001"
    build.tool: podman
  labels:
    app: ugly-no-volume-mount
  name: ugly-no-volume-mount
  namespace: kyverno-test
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: ugly-no-volume-mount
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      annotations:
        build.image: ugly-no-volume-mount
        build.project: kyverno-test
        build.registry: harbor.test.slainte.at
        build.tag: "20261001"
        build.tool: podman
      labels:
        app: ugly-no-volume-mount
    spec:
      containers:
      # The image below is signed and should pass the Kyverno policy check for signed images. Change the uid accordingly if you want to test with a different image.
      - image: harbor.test.slainte.at/kyverno-test/dummy@sha256:57565c078cabc055e833f6e03dd11a5d873e8dd800f5b2e10588d54f0b7f16be
        imagePullPolicy: IfNotPresent
        name: ugly-no-volume-mount
        ports:
        - containerPort: 80
          name: http
          protocol: TCP
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          privileged: false
          readOnlyRootFilesystem: true
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /tmp
          name: tmp-volume
      dnsPolicy: ClusterFirst
      imagePullSecrets:
      - name: harbor-pull
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext:
        fsGroup: 10001
        runAsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
