---
apiVersion: policies.kyverno.io/v1
kind: ImageValidatingPolicy

metadata:
  name: check-image

  annotations:
    policies.kyverno.io/title: Dynamic Signature Validator
    policies.kyverno.io/category: Software Supply Chain Security
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/minversion: 1.18.0
    policies.kyverno.io/description: >-
      This policy verifies that container images are signed using a Cosign
      public key fetched dynamically from a Kubernetes Secret.

spec:

  # Equivalent to validationFailureAction: Enforce
  validationActions:
    - Deny

  # Equivalent to background: false
  evaluation:
    background:
      enabled: false

  # Equivalent to webhookTimeoutSeconds: 30
  webhookConfiguration:
    timeoutSeconds: 30

  # Apply to Pods created or updated directly.
  matchConstraints:
    resourceRules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - pods

  # Match all container images.
  matchImageReferences:
    - glob: "*"

  # Registry credentials used by Kyverno when it accesses
  # Harbor to retrieve the image/signature.
  #
  # IMPORTANT:
  # The Secret must exist in the Kyverno namespace.
  credentials:
    secrets:
      - harbor-pull

  # Dynamically retrieve the Cosign public key.
  variables:
    - name: cosignSecret
      expression: >-
        resource.Get(
          "v1",
          "secrets",
          object.metadata.namespace,
          "harbor-cosign"
        )

  attestors:
    - name: cosign

      cosign:
        key:
          # Secret.data values are base64 encoded by Kubernetes.
          # Decode cosign.pub before passing it to the verifier.
          expression: >-
            base64.decode(variables.cosignSecret.data["cosign.pub"])

  validations:
    - expression: >-
        images.containers.map(
          image,
          verifyImageSignatures(
            image,
            [attestors.cosign]
          )
        ).all(
          result,
          result > 0
        )

      message: >-
        All container images must have a valid Cosign signature.
---