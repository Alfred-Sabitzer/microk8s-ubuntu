# Some exceptions for Kyverno policies. These exceptions are used to allow certain resources to bypass specific policies that would otherwise block them. This is useful in cases where certain resources need to be allowed to exist in the cluster, even if they do not meet the requirements of a specific policy.
---
# This policy excludes some namespaces from all policies. This is necessary because some of the namespaces are used by system components and should not be blocked by policies. For example, the "kube-system" namespace is used by Kubernetes itself, and the "kyverno" namespace is used by Kyverno. Excluding these namespaces from all policies ensures that they can function properly without being blocked by any policies.
apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: exclude-namespaces-from-all-checks
  namespace: kyverno
spec:
  policyRefs:
    - name: disallow-capabilities
      kind: ValidatingPolicy
    - name: disallow-capabilities-strict
      kind: ValidatingPolicy
    - name: disallow-host-namespaces
      kind: ValidatingPolicy
    - name: disallow-host-path
      kind: ValidatingPolicy
    - name: disallow-host-ports
      kind: ValidatingPolicy
    - name: disallow-host-process
      kind: ValidatingPolicy
    - name: disallow-privilege-escalation
      kind: ValidatingPolicy
    - name: disallow-privileged-containers
      kind: ValidatingPolicy
    - name: disallow-proc-mount
      kind: ValidatingPolicy
    - name: disallow-selinux
      kind: ValidatingPolicy
    - name: require-run-as-non-root-user
      kind: ValidatingPolicy
    - name: require-run-as-nonroot
      kind: ValidatingPolicy
    - name: restrict-apparmor-profiles
      kind: ValidatingPolicy
    - name: restrict-seccomp
      kind: ValidatingPolicy
    - name: restrict-seccomp-strict
      kind: ValidatingPolicy
    - name: restrict-sysctls
      kind: ValidatingPolicy
    - name: restrict-volume-types
      kind: ValidatingPolicy
    - name: check-image
      kind: ImageValidatingPolicy
  matchConditions:
    - name: velero-namespace
      expression: >-
        object.metadata.namespace in [
          "cert-manager",
          "container-object-storage-interface",
          "cloudlena",
          "csi-s3",
          "external-secrets",
          "harbor",
          "istio-gateways",
          "istio-system",
          "kiali",
          "kube-node-lease",
          "kube-public",
          "kube-system",
          "kyverno",
          "metallb-system",
          "observability",
          "openbao",
          "rook-ceph",
          "rook-ceph-system",
          "rook-ceph-external",
          "velero",
          "velero-ui"
        ]
---