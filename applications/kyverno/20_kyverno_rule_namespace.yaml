---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy

metadata:
  name: check-namespace

  annotations:
    policies.kyverno.io/title: Namespace Repository Validator
    policies.kyverno.io/category: Sample, EKS Best Practices
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/minversion: 1.18.0
    policies.kyverno.io/description: >-
      This policy enforces that container images match the repository defined
      in the namespace annotation 'image-repository'.

spec:
  validationActions:
    - Deny

  evaluation:
    admission:
      enabled: true
    background:
      enabled: false
    mode: Kubernetes

  webhookConfiguration:
    timeoutSeconds: 30

  # Generate equivalent checks for Deployments, StatefulSets,
  # DaemonSets, Jobs and CronJobs.
  autogen:
    podControllers:
      controllers:
        - deployments
        - statefulsets
        - daemonsets
        - jobs
        - cronjobs

  matchConstraints:
    resourceRules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - pods

  variables:
    - name: namespaceInfo
      expression: >-
        resource.Get(
          "v1",
          "namespaces",
          "",
          object.metadata.namespace
        ).metadata.annotations.get("image-repository", "")

    - name: images
      expression: >-
        object.spec.containers
        + object.spec.?initContainers.orValue([])
          + object.spec.?ephemeralContainers.orValue([])

  validations:
    - expression: >-
        variables.namespaceInfo == "" ||
        variables.images.all(
          container,
          container.image.startsWith(variables.namespaceInfo + "/")
        )
      messageExpression: >-
        "The container image must come from the repository '" +
        variables.namespaceInfo +
        "' configured on namespace '" +
        object.metadata.namespace +
        "'."
---