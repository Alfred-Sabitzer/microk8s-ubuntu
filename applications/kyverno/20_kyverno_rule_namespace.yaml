apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: check-namespace
  annotations:
    policies.kyverno.io/title: Namespace Repository Validator
    policies.kyverno.io/category: Sample, EKS Best Practices
    policies.kyverno.io/severity: medium
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/minversion: 1.7.0
    policies.kyverno.io/description: >-
      This policy enforces that container images match the repository defined
      in the namespace annotation 'image-repository'

spec:
  validationFailureAction: Enforce
  background: false
  webhookTimeoutSeconds: 30

  rules:

    # ============================================================
    # RULE 1: Image must come from the namespace repository
    # ============================================================
    - name: validate-image-repo-from-annotation

      match:
        any:
          - resources:
              kinds:
                - Pod

      context:
        # Fetch the target namespace metadata and extract the annotation value
        - name: namespace_info
          apiCall:
            urlPath: /api/v1/namespaces/{{request.namespace}}
            jmesPath: "metadata.annotations.\"image-repository\" || ''"

      preconditions:
        all:
          # Only run this rule if the namespace actually has the annotation defined
          - key: "{{ namespace_info }}"
            operator: NotEquals
            value: ""

      validate:
        foreach:
          - list: "request.object.spec.[containers, initContainers, ephemeralContainers][]"
            deny:
              conditions:
                all:
                  # Fix: Move the message directly into the condition block where Kyverno schema allows it
                  - key: "{{ starts_with(element.image, namespace_info) }}"
                    operator: Equals
                    value: false
                    message: >-
                      The container image '{{ element.image }}' does not match
                      the allowed repository '{{ namespace_info }}' configured
                      on this namespace.
